function attachSwipe(wrapEl, itemEl, onDelete){
  let startX=0, currentX=0, dragging=false;
  const threshold=-80;
  itemEl.addEventListener('touchstart',e=>{ startX=e.touches[0].clientX; dragging=true; itemEl.style.transition='none'; },{passive:true});
  itemEl.addEventListener('touchmove',e=>{
    if(!dragging) return;
    currentX=e.touches[0].clientX-startX;
    if(currentX>0) currentX=0;
    itemEl.style.transform=`translateX(${currentX}px)`;
  },{passive:true});
  itemEl.addEventListener('touchend',()=>{
    dragging=false;
    itemEl.style.transition='transform .2s ease';
    if(currentX<threshold){
      itemEl.style.transform=`translateX(-100%)`;
      setTimeout(()=>{ onDelete(); scheduleSave(); },180);
    } else {
      itemEl.style.transform='translateX(0)';
    }
    currentX=0;
  });
  // soporte ratón (desktop/preview)
  let mouseDown=false;
  itemEl.addEventListener('mousedown',e=>{ mouseDown=true; startX=e.clientX; itemEl.style.transition='none'; });
  window.addEventListener('mousemove',e=>{
    if(!mouseDown) return;
    currentX=e.clientX-startX;
    if(currentX>0) currentX=0;
    itemEl.style.transform=`translateX(${currentX}px)`;
  });
  window.addEventListener('mouseup',()=>{
    if(!mouseDown) return;
    mouseDown=false;
    itemEl.style.transition='transform .2s ease';
    if(currentX<threshold){
      itemEl.style.transform=`translateX(-100%)`;
      setTimeout(()=>{ onDelete(); scheduleSave(); },180);
    } else {
      itemEl.style.transform='translateX(0)';
    }
    currentX=0;
  });
}

/* =========================================================
   PERSISTENCIA (IndexedDB)
   Toda la app (recetas, ingredientes, planificador y lista de
   la compra) se guarda en IndexedDB para que los datos
   sobrevivan al cerrar Safari o reiniciar el iPhone.
========================================================= */
const DB_NAME='alimentacion-db';
const DB_STORE='kv';
const STATE_KEY='state';
let _dbPromise=null;

function openDatabase(){
  if(_dbPromise) return _dbPromise;
  _dbPromise=new Promise((resolve,reject)=>{
    if(!('indexedDB' in window)){ reject(new Error('IndexedDB no disponible')); return; }
    const req=indexedDB.open(DB_NAME,1);
    req.onupgradeneeded=(e)=>{
      const db=e.target.result;
      if(!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
    };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
  return _dbPromise;
}
function idbGet(key){
  return openDatabase().then(db=>new Promise((resolve,reject)=>{
    const tx=db.transaction(DB_STORE,'readonly');
    const req=tx.objectStore(DB_STORE).get(key);
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  }));
}
function idbSet(key,value){
  return openDatabase().then(db=>new Promise((resolve,reject)=>{
    const tx=db.transaction(DB_STORE,'readwrite');
    tx.objectStore(DB_STORE).put(value,key);
    tx.oncomplete=()=>resolve();
    tx.onerror=()=>reject(tx.error);
  }));
}

let _saveTimer=null, _saveInFlight=false, _saveAgain=false, _dirty=false;
function scheduleSave(){
  _dirty=true;
  clearTimeout(_saveTimer);
  _saveTimer=setTimeout(flushSave,450);
}
async function flushSave(){
  clearTimeout(_saveTimer);
  if(!_dirty) return;
  if(_saveInFlight){ _saveAgain=true; return; }
  _saveInFlight=true;
  try{
    const snapshot=JSON.parse(JSON.stringify(state));
    await idbSet(STATE_KEY,snapshot);
    _dirty=false;
  }catch(err){
    console.error('No se pudieron guardar los datos',err);
  }finally{
    _saveInFlight=false;
    if(_saveAgain){ _saveAgain=false; flushSave(); }
  }
}
async function loadState(){
  try{
    const saved=await idbGet(STATE_KEY);
    if(saved && typeof saved==='object'){
      state.ingredients = Array.isArray(saved.ingredients)?saved.ingredients:[];
      state.categories = Array.isArray(saved.categories)?saved.categories:[];
      state.recipes = Array.isArray(saved.recipes)?saved.recipes:[];
      state.planner = (saved.planner && typeof saved.planner==='object')?saved.planner:{};
      state.shopping = (saved.shopping && typeof saved.shopping==='object')?saved.shopping:state.shopping;
      state.shopping.recipeEntries = state.shopping.recipeEntries||[];
      state.shopping.manualItems = state.shopping.manualItems||[];
      state.shopping.boughtIngredientIds = state.shopping.boughtIngredientIds||[];
      state.shopping.boughtEntryKeys = state.shopping.boughtEntryKeys||[];
      state.shopping.excludedIngredientIds = state.shopping.excludedIngredientIds||[];
      return true; // ya había datos guardados
    }
  }catch(err){
    console.error('No se pudieron cargar los datos guardados, se usarán datos de ejemplo',err);
  }
  return false; // no había nada guardado -> primer uso
}

// Red de seguridad: guarda tras cualquier interacción (click/tecleo/gesto),
// al pasar a segundo plano y periódicamente. Esto cubre todas las acciones
// de la app sin tener que instrumentar cada función una a una.
['click','input','change'].forEach(evt=>document.addEventListener(evt,()=>scheduleSave()));
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') flushSave(); });
window.addEventListener('pagehide',()=>flushSave());
window.addEventListener('blur',()=>flushSave());
setInterval(()=>{ if(_dirty) flushSave(); },4000);

/* =========================================================
   FOTOS: selección desde galería/cámara + compresión
========================================================= */
const MAX_PHOTO_DIM=1000;      // lado máximo en píxeles
const PHOTO_QUALITY=0.72;      // calidad JPEG (0-1)

function compressImageFile(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=()=>reject(reader.error);
    reader.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error('Imagen no válida'));
      img.onload=()=>{
        let {width,height}=img;
        if(width>height && width>MAX_PHOTO_DIM){ height=Math.round(height*MAX_PHOTO_DIM/width); width=MAX_PHOTO_DIM; }
        else if(height>=width && height>MAX_PHOTO_DIM){ width=Math.round(width*MAX_PHOTO_DIM/height); height=MAX_PHOTO_DIM; }
        const canvas=document.createElement('canvas');
        canvas.width=width; canvas.height=height;
        const ctx=canvas.getContext('2d');
        ctx.drawImage(img,0,0,width,height);
        resolve(canvas.toDataURL('image/jpeg',PHOTO_QUALITY));
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}

let _photoTargetCallback=null;
const photoFileInput=$('#photo-file-input');

/* =========================================================
   COPIA DE SEGURIDAD (exportar / importar)
   Incluye recetas (con sus fotos ya comprimidas), ingredientes
   y categorías. El planificador y la lista de la compra se
   excluyen a propósito, tal y como se pidió.
========================================================= */
function buildBackupPayload(){
  return {
    app:'alimentacion',
    type:'backup',
    version:1,
    exportedAt:new Date().toISOString(),
    categories:state.categories,
    ingredients:state.ingredients,
    recipes:state.recipes
  };
}

function exportBackup(){
  try{
    const json=JSON.stringify(buildBackupPayload(),null,2);
    const blob=new Blob([json],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const stamp=new Date().toISOString().slice(0,10);
    const a=document.createElement('a');
    a.href=url;
    a.download=`alimentacion-backup-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    showToast('Copia de seguridad exportada');
  }catch(err){
    console.error('Error exportando copia de seguridad',err);
    showToast('No se pudo exportar la copia de seguridad');
  }
}

function isValidBackupPayload(obj){
  return !!obj && typeof obj==='object'
    && Array.isArray(obj.recipes) && Array.isArray(obj.ingredients) && Array.isArray(obj.categories);
}

function triggerImportFilePicker(){ $('#backup-file-input').click(); }

$('#backup-file-input').addEventListener('change',(e)=>{
  const file=e.target.files && e.target.files[0];
  e.target.value='';
  if(!file) return;
  const reader=new FileReader();
  reader.onerror=()=>showToast('No se pudo leer el archivo');
  reader.onload=()=>{
    let parsed;
    try{ parsed=JSON.parse(reader.result); }
    catch(err){ showToast('El archivo no es una copia de seguridad válida'); return; }
    if(!isValidBackupPayload(parsed)){ showToast('El archivo no es una copia de seguridad válida'); return; }
    openBackupConfirmSheet(parsed);
  };
  reader.readAsText(file);
});

function openBackupConfirmSheet(payload){
  const dateTxt = payload.exportedAt
    ? new Date(payload.exportedAt).toLocaleString('es-ES',{dateStyle:'medium', timeStyle:'short'})
    : 'fecha desconocida';
  openSheet({
    title:'Restaurar copia de seguridad',
    bodyBuilder:(body)=>{
      body.innerHTML=`
        <p class="subsection-hint">Archivo del ${dateTxt}, con <b style="color:var(--text);">${payload.recipes.length}</b> receta${payload.recipes.length===1?'':'s'} y <b style="color:var(--text);">${payload.ingredients.length}</b> alimento${payload.ingredients.length===1?'':'s'}.</p>
        <p class="subsection-hint" style="color:var(--paprika);">Esto reemplazará todas tus recetas y alimentos actuales por los del archivo. El planificador y la lista de la compra no se ven afectados. Esta acción no se puede deshacer.</p>
      `;
    },
    footerLabel:'Restaurar',
    onConfirm:()=>{
      state.categories = payload.categories;
      state.ingredients = payload.ingredients;
      state.recipes = payload.recipes;
      renderCategoryChips();
      renderRecipeList();
      showToast('Copia de seguridad restaurada');
    }
  });
}

function openBackupSheet(){
  openSheet({
    title:'Copia de seguridad',
    bodyBuilder:(body)=>{
      body.innerHTML=`
        <button type="button" class="btn btn-primary btn-full" id="backup-export-btn" style="margin-top:6px;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M12 15l-4-4M12 15l4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
          Exportar copia de seguridad
        </button>
        <button type="button" class="btn btn-secondary btn-full" id="backup-import-btn" style="margin-top:10px;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V9M12 9l-4 4M12 9l4 4"/><path d="M4 3v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V3"/></svg>
          Importar copia de seguridad
        </button>
      `;
      body.querySelector('#backup-export-btn').addEventListener('click',()=>{ exportBackup(); closeSheet(); });
      body.querySelector('#backup-import-btn').addEventListener('click',()=>{ closeSheet(); triggerImportFilePicker(); });
    }
  });
}

/* =========================================================
   PWA: service worker + aviso de instalación en iPhone
========================================================= */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').catch(err=>console.error('SW error',err));
  });
}
(function initInstallBanner(){
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const dismissed = localStorage.getItem('installBannerDismissed')==='1';
  const banner=$('#install-banner');
  if(isIOS && !isStandalone && !dismissed){
    setTimeout(()=>banner.classList.add('show'),1200);
  }
  $('#install-banner-close').addEventListener('click',()=>{
    banner.classList.remove('show');
    localStorage.setItem('installBannerDismissed','1');
  });
})();

/* =========================================================
   INICIALIZACIÓN
========================================================= */
(async function init(){
  const hadSavedData = await loadState();
  if(!hadSavedData) seed();
  switchTab('recetas');
  renderHeaderActions();
  renderCategoryChips();
  renderRecipeList();
  renderPlanner();
  renderShopping();
  enhanceSearchBar($('#recipe-search-bar'));
  enhanceSearchBar($('#ing-search-bar'));
  if(!hadSavedData) scheduleSave(); // persiste los datos de ejemplo en el primer uso
})();

})();
