    .filter(i=>normalize(i.name).includes(nq))
    .sort((a,b)=>a.name.localeCompare(b.name,'es'));

  if(items.length===0){
    const hasQuery=!!q.trim();
    wrap.innerHTML=`<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 2v20M6 2c-2 0-3 2-3 5s1 5 3 5M6 12v10"/><path d="M18 2v9a3 3 0 0 1-6 0V2"/></svg><h3>${hasQuery?'Sin resultados':'Sin alimentos'}</h3>${hasQuery?'':'<p>Crea alimentos para poder usarlos en tus recetas.</p>'}</div>`;
    return;
  }

  items.forEach(ing=>{
    const uses=ingredientUsageCount(ing.id);
    const canDelete=uses===0;
    const row=document.createElement('div');
    row.className='ing-master-row';
    row.innerHTML=`
      <span class="n">${ing.name}${ing.isSpice?'<span class="spice-tag">Especia</span>':''}</span>
      <span class="cnt">${uses} receta${uses===1?'':'s'}</span>
      <span class="actions">
        <button class="edit-ing"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
        <button class="del-ing${canDelete?'':' disabled'}" title="${canDelete?'':'No se puede eliminar: está en uso'}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg></button>
      </span>`;
    row.querySelector('.edit-ing').addEventListener('click',()=>openIngredientEditSheet(ing));
    row.querySelector('.del-ing').addEventListener('click',()=>{
      if(!canDelete){ showToast('No se puede eliminar: está en uso en alguna receta'); return; }
      deleteIngredient(ing);
    });
    wrap.appendChild(row);
  });
}

function deleteIngredient(ing){
  if(ingredientUsageCount(ing.id)>0){
    showToast('No se puede eliminar: está en uso en alguna receta');
    return;
  }
  state.ingredients = state.ingredients.filter(i=>i.id!==ing.id);
  renderIngredientsView($('#ing-search').value);
  renderRecipeList();
  showToast('Alimento eliminado');
}

/* =========================================================
   AÑADIR A LA CESTA (desde receta)
========================================================= */
function openAddToCartSheet(recipeId, servings){
  const r=state.recipes.find(x=>x.id===recipeId);
  const scaled=scaledIngredients(r,servings);
  const selection={}; // ingredientId -> {checked, qty, unit, name, defaultQty}
  scaled.forEach(i=>{
    const defQty=Math.round(i.scaledQty*100)/100;
    selection[i.ingredientId]={checked:true, qty:defQty, defaultQty:defQty, unit:i.unit, name:i.name};
  });

  openSheet({
    title:'Añadir a la cesta',
    bodyBuilder:(body)=>{
      scaled.forEach(i=>{
        const row=document.createElement('div');
        row.className='sel-row checked';
        row.innerHTML=`
          <div class="sel-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
          <div class="sel-row-body">${i.name}</div>
          <div class="qty-inline">
            <input type="number" value="${fmtQty(i.scaledQty)}" class="qty-val">
            <span class="unit">${i.unit}</span>
          </div>`;
        row.querySelector('.sel-check').addEventListener('click',()=>{
          selection[i.ingredientId].checked=!selection[i.ingredientId].checked;
          row.classList.toggle('checked',selection[i.ingredientId].checked);
        });
        row.querySelector('.qty-val').addEventListener('input',e=>{ selection[i.ingredientId].qty=Number(e.target.value)||0; });
        body.appendChild(row);
      });
    },
    footerLabel:'Añadir a la cesta',
    onConfirm:()=>{
      const all=Object.entries(selection);
      const checked=all.filter(([,s])=>s.checked && s.qty>0);
      if(checked.length===0){ showToast('No has seleccionado ingredientes'); return; }
      // Se crea como una entrada de receta más (igual que al planificarla), para que
      // en la lista de la compra aparezca agrupada bajo esta receta y no suelta en "Otros".
      const excludedIds = all.filter(([,s])=>!(s.checked && s.qty>0)).map(([id])=>id);
      const entry={id:uid('shopent'), recipeId, servings, excludedIds};
      state.shopping.recipeEntries.push(entry);
      checked.forEach(([ingredientId,s])=>{
        if(Math.abs(s.qty - s.defaultQty) > 1e-9){
          state.shopping.qtyOverrides[entry.id+'|'+ingredientId]=s.qty;
        }
      });
      if(currentTab==='compra') renderShopping();
      showToast('Añadido a la lista de la compra');
    }
  });
}

/* =========================================================
   PLANIFICADOR SEMANAL
========================================================= */
let weekOffset=0;

function weekMondayKey(offset){
  const monday=addDays(mondayOf(new Date()), offset*7);
  return dateKey(monday);
}
function ensureWeek(offset){
  const key=weekMondayKey(offset);
  if(!state.planner[key]) state.planner[key]=[[],[],[],[],[],[],[]];
  return state.planner[key];
}

function renderPlanner(){
  const monday=addDays(mondayOf(new Date()), weekOffset*7);
  const sunday=addDays(monday,6);
  const sameMonth=monday.getMonth()===sunday.getMonth();
  const rangeText = sameMonth
    ? `${monday.getDate()} – ${sunday.getDate()} ${MONTHS[monday.getMonth()]} ${monday.getFullYear()}`
    : `${monday.getDate()} ${MONTHS[monday.getMonth()]} – ${sunday.getDate()} ${MONTHS[sunday.getMonth()]}`;
  $('#week-range').textContent=rangeText;
  $('#week-tag').style.display = weekOffset===0 ? 'inline-block' : 'none';

  const week=ensureWeek(weekOffset);
  const todayKey=dateKey(new Date());
  const wrap=$('#week-days'); wrap.innerHTML='';

  for(let d=0; d<7; d++){
    const date=addDays(monday,d);
    const isToday=dateKey(date)===todayKey;
    const block=document.createElement('div');
    block.className='day-block'+(isToday?' today':'');
    const entriesHtml = week[d].map((entry,idx)=>{
      if(entry.type==='recipe'){
        const rec=state.recipes.find(r=>r.id===entry.recipeId);
        const img=rec?(rec.photo||BLANK_PHOTO):BLANK_PHOTO;
        return `<div class="day-entry${rec?' day-entry-recipe':''}" data-idx="${idx}">
          <img src="${img}">
          <div class="txt">${rec?rec.name:'Receta eliminada'}</div>
          <button class="del-entry"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
        </div>`;
      }
      return `<div class="day-entry" data-idx="${idx}">
        <div class="placeholder-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5V4.5A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg></div>
        <div class="txt">${entry.text}<small>Nota</small></div>
        <button class="del-entry"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>`;
    }).join('');

    block.innerHTML=`
      <div class="day-block-head">
        <span class="day-name">${DAY_NAMES[d]}</span>
        <span class="day-date">${date.getDate()} ${MONTHS[date.getMonth()]}</span>
      </div>
      ${entriesHtml}
      <button type="button" class="add-entry-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Añadir</button>
    `;
    block.querySelector('.add-entry-btn').addEventListener('click',()=>openAddPlannerEntrySheet(weekOffset,d));
    $$('.day-entry-recipe',block).forEach((el)=>{
      el.addEventListener('click',(ev)=>{
        if(ev.target.closest('.del-entry')) return;
        const idx=Number(el.dataset.idx);
        const entry=week[d][idx];
        if(entry && entry.type==='recipe' && state.recipes.some(r=>r.id===entry.recipeId)){
          openRecipeDetail(entry.recipeId);
        }
      });
    });
    $$('.del-entry',block).forEach(btn=>{
      btn.addEventListener('click',(ev)=>{
        const idx=Number(ev.currentTarget.closest('.day-entry').dataset.idx);
        week[d].splice(idx,1);
        renderPlanner();
      });
    });
    wrap.appendChild(block);
  }
}
$('#week-prev').addEventListener('click',()=>{ weekOffset--; renderPlanner(); });
$('#week-next').addEventListener('click',()=>{ weekOffset++; renderPlanner(); });

/* Centra el scroll del planificador en el día actual (si la semana visible
   es la semana en curso), dejando la cabecera de navegación visible. */
function centerPlannerOnToday(){
  const panel=$('#panel-planificador');
  requestAnimationFrame(()=>{
    if(weekOffset!==0){ panel.scrollTop=0; return; }
    const todayBlock=$('#week-days .day-block.today');
    if(!todayBlock){ panel.scrollTop=0; return; }
    const nav=$('#panel-planificador .week-nav');
    const navHeight=nav?nav.getBoundingClientRect().height:0;
    panel.scrollTop=Math.max(todayBlock.offsetTop-navHeight-10, 0);
  });
}

/* Sheet con calendario para elegir semana desde la pestaña Planificador */
function openWeekCalendarSheet(){
  const viewMonday=addDays(mondayOf(new Date()), weekOffset*7);
  const viewSunday=addDays(viewMonday,6);
  const todayKey=dateKey(new Date());
  let calMonth=new Date(viewMonday.getFullYear(), viewMonday.getMonth(), 1);

  openSheet({
    title:'Elegir semana',
    bodyBuilder:(body)=>{
      const wrap=document.createElement('div');
      wrap.className='cal-picker';
      body.appendChild(wrap);

      function renderCal(){
        const y=calMonth.getFullYear(), m=calMonth.getMonth();
        const startGrid=mondayOf(new Date(y,m,1));
        const monthLabel=`${MONTHS[m]} ${y}`;
        let cellsHtml='';
        for(let i=0;i<42;i++){
          const d=addDays(startGrid,i);
          const inMonth=d.getMonth()===m;
          const key=dateKey(d);
          const isToday=key===todayKey;
          const inSelWeek= d>=viewMonday && d<=viewSunday;
          cellsHtml+=`<button type="button" class="cal-day${inMonth?'':' out'}${isToday?' cal-today':''}${inSelWeek?' cal-sel':''}" data-key="${key}">${d.getDate()}</button>`;
        }
        wrap.innerHTML=`
          <div class="cal-head">
            <button type="button" class="cal-nav" id="cal-prev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
            <div class="cal-month">${monthLabel}</div>
            <button type="button" class="cal-nav" id="cal-next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>
          </div>
          <div class="cal-weekdays">${DAY_SHORT.map(d=>`<span>${d[0]}</span>`).join('')}</div>
          <div class="cal-grid">${cellsHtml}</div>
          <button type="button" class="btn btn-secondary btn-full cal-today-btn" id="cal-goto-today">Ir a la semana actual</button>
        `;
        wrap.querySelector('#cal-prev').addEventListener('click',()=>{ calMonth=new Date(y,m-1,1); renderCal(); });
        wrap.querySelector('#cal-next').addEventListener('click',()=>{ calMonth=new Date(y,m+1,1); renderCal(); });
        wrap.querySelector('#cal-goto-today').addEventListener('click',()=>{
          weekOffset=0;
          closeSheet();
          renderPlanner();
          centerPlannerOnToday();
        });
        $$('.cal-day',wrap).forEach(btn=>{
          btn.addEventListener('click',()=>{
            const picked=new Date(btn.dataset.key+'T00:00:00');
            const pickedMonday=mondayOf(picked);
            const baseMonday=mondayOf(new Date());
            const diffWeeks=Math.round((pickedMonday-baseMonday)/(7*86400000));
            weekOffset=diffWeeks;
            closeSheet();
            renderPlanner();
            centerPlannerOnToday();
          });
        });
      }
      renderCal();
    }
  });
}

          const chip=document.createElement('button');

/* =========================================================
   LISTA DE LA COMPRA
========================================================= */
function addRecipeToShoppingList(recipeId){
  const r=state.recipes.find(x=>x.id===recipeId);
  if(!r) return;
  state.shopping.recipeEntries.push({id:uid('shopent'), recipeId, servings:r.servings, excludedIds:[]});
  if(currentTab==='compra') renderShopping();
}

function addManualShoppingItems(items){
  items.forEach(it=>{
    let group=state.shopping.manualItems.find(g=>normalize(g.name)===normalize(it.name) && normalize(g.unit||'')===normalize(it.unit||''));
    if(!group){
      group={id:uid('shop'), name:it.name, unit:it.unit||'', qty:0, bought:false, breakdown:[]};
      state.shopping.manualItems.push(group);
    }
    if(it.qty){
      group.qty += it.qty;
      if(it.recipeName){
        const existingSrc=group.breakdown.find(b=>b.recipe===it.recipeName);
        if(existingSrc) existingSrc.qty += it.qty;
        else group.breakdown.push({recipe:it.recipeName, qty:it.qty});
      }
    }
    group.bought=false;
  });
  if(currentTab==='compra') renderShopping();
}

/* Cantidad "efectiva" de un ingrediente dentro de una recipeEntry concreta: la cantidad
   escalada de la receta (qty * raciones/raciones-base), salvo que el usuario la haya editado
   manualmente desde la lista de la compra, en cuyo caso se usa esa cantidad editada. Esta es la
   pieza clave que permite que un cambio de cantidad se comparta entre la vista "Recetas" y la
   vista "Agregado": ambas leen (y escriben) el mismo valor guardado en qtyOverrides. */
function getEntryQty(entry, i){
  const key=entry.id+'|'+i.ingredientId;
  const ov=state.shopping.qtyOverrides[key];
  return (typeof ov==='number' && isFinite(ov)) ? ov : i.scaledQty;
}

function setEntryQty(entry, i, newQty){
  const key=entry.id+'|'+i.ingredientId;
  state.shopping.qtyOverrides[key]=newQty;
}

/* Al cambiar las raciones de una receta en la lista de la compra, las cantidades editadas
   manualmente para esa entrada dejan de tener sentido (se calcularon para otro número de
   raciones), así que se descartan y se recalculan desde la receta. */
function clearEntryOverrides(entryId){
  Object.keys(state.shopping.qtyOverrides).forEach(k=>{
    if(k.startsWith(entryId+'|')) delete state.shopping.qtyOverrides[k];
  });
}

/* Edita la cantidad total de un grupo agregado. Cuando ese total proviene de varias
   "apariciones" (la misma receta añadida varias veces, o recetas distintas que comparten
   ingrediente), se reparte el nuevo total proporcionalmente entre todas ellas, manteniendo su
   peso relativo, y se guarda como qtyOverrides por cada una: así el cambio se refleja también
   en la vista "Recetas". */
function setAggregatedGroupQty(group, newQty){
  if(group.isManual){
    const it=state.shopping.manualItems.find(x=>x.id===group.manualId);
    if(it) it.qty=newQty;
    return;
  }
  if(!group.entries || group.entries.length===0) return;
  const oldQty=group.qty;
  if(oldQty>1e-9){
    const ratio=newQty/oldQty;
    group.entries.forEach(e=>{ state.shopping.qtyOverrides[e.entryKey]=e.qty*ratio; });
  } else {
    const share=newQty/group.entries.length;
    group.entries.forEach(e=>{ state.shopping.qtyOverrides[e.entryKey]=share; });
  }
}

/* Agrega los ingredientes (escalados) de todas las recipeEntries + los manualItems en filas únicas.
   El estado de "comprado" se guarda por cada aparición de la receta (entryKey = recipeEntryId+ingredientId),
   así que si la misma receta está añadida dos veces, marcar un ingrediente en una de ellas no afecta a la
   otra: la fila agregada solo se tacha cuando TODAS las apariciones están marcadas. */
function computeAggregatedGroups(){
  const map={};
  state.shopping.recipeEntries.forEach(entry=>{
    const r=state.recipes.find(x=>x.id===entry.recipeId);
    if(!r) return;
    scaledIngredients(r, entry.servings).forEach(i=>{
      if(state.shopping.excludedIngredientIds.includes(i.ingredientId)) return;
      if((entry.excludedIds||[]).includes(i.ingredientId)) return;
      const key='ing:'+i.ingredientId+'|'+normalize(i.unit);
      if(!map[key]) map[key]={
        key, ingredientId:i.ingredientId, name:i.name, unit:i.unit, qty:0, boughtQty:0, breakdown:[], entries:[], isManual:false
      };
      const g=map[key];
      const entryKey=entry.id+'|'+i.ingredientId;
      const qty=getEntryQty(entry,i);
      g.qty += qty;
      g.entries.push({entryKey, qty});
      if(state.shopping.boughtEntryKeys.includes(entryKey)) g.boughtQty += qty;
      const src=g.breakdown.find(b=>b.recipe===r.name);
      if(src) src.qty += qty; else g.breakdown.push({recipe:r.name, qty});
    });
  });
  const recipeGroups=Object.values(map).map(g=>{
    const bought = g.qty>0 && g.boughtQty >= g.qty - 1e-6;
    const partial = !bought && g.boughtQty > 1e-6;
    return {...g, bought, partial};
  });
  const manualGroups=state.shopping.manualItems.map(it=>({
    key:'manual:'+it.id, manualId:it.id, name:it.name, unit:it.unit, qty:it.qty, breakdown:it.breakdown, bought:it.bought, partial:false, isManual:true
  }));
  return [...recipeGroups, ...manualGroups];
}

function totalShoppingCount(){
  return computeAggregatedGroups().length;
}

function renderShopping(){
  $$('#shop-seg .shop-seg-btn').forEach(b=>b.classList.toggle('active', b.dataset.mode===state.settings.shopMode));
  const count=totalShoppingCount();
  $('#shop-count').textContent = `${count} artículo${count===1?'':'s'}`;

  const wrap=$('#shop-list'); wrap.innerHTML='';
  const isEmpty = state.shopping.recipeEntries.length===0 && state.shopping.manualItems.length===0;
  wrap.classList.toggle('shop-list-empty', isEmpty);
  if(isEmpty){
    wrap.innerHTML=`<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="21" r="1.2"/><circle cx="18" cy="21" r="1.2"/><path d="M2.5 3h2l2.4 12.2a2 2 0 0 0 2 1.6h8.3a2 2 0 0 0 2-1.6L21 7H6"/></svg><h3>Tu cesta está vacía</h3></div>`;
    return;
  }

  if(state.settings.shopMode==='agregado') renderShoppingAggregated(wrap);
  else renderShoppingByRecipe(wrap);
}

function renderShoppingAggregated(wrap){
  const groups=computeAggregatedGroups();
  if(groups.length===0){
    wrap.innerHTML=`<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="21" r="1.2"/><circle cx="18" cy="21" r="1.2"/><path d="M2.5 3h2l2.4 12.2a2 2 0 0 0 2 1.6h8.3a2 2 0 0 0 2-1.6L21 7H6"/></svg><h3>Sin artículos</h3><p>Has eliminado todos los alimentos agregados.</p></div>`;
    return;
  }
  const items=[...groups].sort((a,b)=> (a.bought===b.bought) ? 0 : (a.bought?1:-1));

  items.forEach(group=>{
    const swipeWrap=document.createElement('div');
    swipeWrap.className='swipe-wrap';
    const totalTxt = group.qty ? `${fmtQty(group.qty)} ${group.unit||''}`.trim() : '';
    const breakdownTxt = group.breakdown && group.breakdown.length
      ? group.breakdown.map(b=>`<div>${(`${b.recipe}: ${fmtQty(b.qty)} ${group.unit||''}`).trim()}</div>`).join('')
      : '';
    const remainingTxt = group.partial ? `${fmtQty(group.qty-group.boughtQty)} ${group.unit||''}`.trim() : '';
    const statusClass = group.bought?'bought':(group.partial?'partial':'');
    const partialStyle = group.partial ? ` style="--partial-pct:${Math.min(100,Math.round((group.boughtQty/group.qty)*100))}%"` : '';
    swipeWrap.innerHTML=`
      <div class="swipe-del"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></div>
      <div class="shop-item ${statusClass}">
        <div class="shop-check"${partialStyle}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
        <div class="shop-item-body">
          <div class="shop-item-row">
            <div class="shop-item-left">
              <div class="shop-item-name">${group.name}</div>
              ${breakdownTxt?`<div class="shop-breakdown">${breakdownTxt}</div>`:''}
            </div>
            <div class="shop-item-right">
              ${totalTxt?`<div class="total${group.partial?' partial-total':''}">${totalTxt}</div>`:''}
              ${remainingTxt?`<div class="shop-remaining-note">${remainingTxt}</div>`:''}
            </div>
          </div>
        </div>
      </div>`;
    const itemEl=swipeWrap.querySelector('.shop-item');
    itemEl.querySelector('.shop-check').addEventListener('click',()=>{
      if(group.isManual){
        const it=state.shopping.manualItems.find(x=>x.id===group.manualId);
        if(it) it.bought=!it.bought;
      } else {
        // Si no está totalmente comprado, marcamos todas las apariciones de este
        // ingrediente (en cada receta añadida) como compradas; si ya lo estaba,
        // las desmarcamos todas.
        const makeBought=!group.bought;
        group.entries.forEach(({entryKey:k})=>{
          const idx=state.shopping.boughtEntryKeys.indexOf(k);
          if(makeBought){ if(idx<0) state.shopping.boughtEntryKeys.push(k); }
          else if(idx>=0) state.shopping.boughtEntryKeys.splice(idx,1);
        });
      }
      renderShopping();
    });
    if(totalTxt){
      const totalEl=itemEl.querySelector('.total');
      totalEl.classList.add('qty-editable');
      totalEl.addEventListener('click',(ev)=>{
        ev.stopPropagation();
        openQtyEditSheet('Editar cantidad · '+group.name, group.qty, group.unit, (newQty)=>{
          setAggregatedGroupQty(group, newQty);
          renderShopping();
        });
      });
    }
    attachSwipe(swipeWrap, itemEl, ()=>{
      if(group.isManual){
        state.shopping.manualItems = state.shopping.manualItems.filter(x=>x.id!==group.manualId);
      } else {
        state.shopping.excludedIngredientIds.push(group.ingredientId);
      }
      renderShopping();
    });
    wrap.appendChild(swipeWrap);
  });
}

      ing.forEach(i=>{
        const entryKey=entry.id+'|'+i.ingredientId;
        const bought=state.shopping.boughtEntryKeys.includes(entryKey);

        const row=document.createElement('div');
        row.className='shop-recipe-ing-row'+(bought?' bought':'');
        row.innerHTML=`
          <div class="shop-check" style="${bought?'background:var(--accent);border-color:var(--accent);':''}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="opacity:${bought?1:0};"><polyline points="20 6 9 17 4 12"/></svg></div>

          else state.shopping.boughtEntryKeys.push(entryKey);
          renderShopping();
        });
        row.querySelector('.qty').addEventListener('click',(ev)=>{
          ev.stopPropagation();
          openQtyEditSheet('Editar cantidad · '+i.name, effQty, i.unit, (newQty)=>{
            setEntryQty(entry, i, newQty);
            renderShopping();
          });
        });
        row.querySelector('.del-ing-row').addEventListener('click',(ev)=>{
          ev.stopPropagation();
          state.shopping.excludedIngredientIds.push(i.ingredientId);
          renderShopping();
        });
        ingsWrap.appendChild(row);
      });
    }
    card.querySelector('.rs-minus').addEventListener('click',()=>{ if(entry.servings>1){ entry.servings--; clearEntryOverrides(entry.id); renderShopping(); }});
    card.querySelector('.rs-plus').addEventListener('click',()=>{ entry.servings++; clearEntryOverrides(entry.id); renderShopping(); });
    swipeWrap.innerHTML=`<div class="swipe-del"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></div>`;
    swipeWrap.appendChild(card);
    attachSwipe(swipeWrap, card, ()=>{
      state.shopping.recipeEntries = state.shopping.recipeEntries.filter(e=>e.id!==entry.id);
      clearEntryOverrides(entry.id);
      renderShopping();
    });
    wrap.appendChild(swipeWrap);
  });

  if(state.shopping.manualItems.length){
    const label=document.createElement('div');
    label.className='shop-group-label';
    label.textContent='Otros';
    wrap.appendChild(label);
    const card=document.createElement('div');
    card.className='shop-other-card';
    state.shopping.manualItems.forEach(it=>{
      const row=document.createElement('div');
      row.className='shop-other-row';
      const qtyTxt = it.qty ? `${fmtQty(it.qty)} ${it.unit||''}`.trim() : '';
      row.innerHTML=`
        <div class="shop-check" style="${it.bought?'background:var(--accent);border-color:var(--accent);':''}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="opacity:${it.bought?1:0};"><polyline points="20 6 9 17 4 12"/></svg></div>
        <span style="flex:1; min-width:0; ${it.bought?'text-decoration:line-through;color:var(--text-mute);':''}">${it.name}</span>
        ${qtyTxt?`<span style="color:var(--accent); font-weight:700; flex-shrink:0;">${qtyTxt}</span>`:''}
        <button type="button" class="del-manual-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      `;
      row.querySelector('.shop-check').addEventListener('click',()=>{ it.bought=!it.bought; renderShopping(); });
      row.querySelector('.del-manual-item').addEventListener('click',()=>{
        state.shopping.manualItems = state.shopping.manualItems.filter(x=>x.id!==it.id);
        renderShopping();
      });
      card.appendChild(row);
    });
    wrap.appendChild(card);
  }
}

function attachSwipe(wrapEl, itemEl, onDelete){
  let startX=0, currentX=0, dragging=false;
  const threshold=-80;
  itemEl.addEventListener('touchstart',e=>{ startX=e.touches[0].clientX; dragging=true; itemEl.style.transition='none'; },{passive:true});
  itemEl.addEventListener('touchmove',e=>{
    if(!dragging) return;
    currentX=e.touches[0].clientX-startX;
    if(currentX>0) currentX=0;
    itemEl.style.transform=`translateX(${currentX}px)`;
  },{passive:true});
  itemEl.addEventListener('touchend',()=>{
    dragging=false;
    itemEl.style.transition='transform .2s ease';
    if(currentX<threshold){
      itemEl.style.transform=`translateX(-100%)`;
      setTimeout(()=>{ onDelete(); scheduleSave(); },180);
    } else {
      itemEl.style.transform='translateX(0)';
    }
    currentX=0;
  });
  // soporte ratón (desktop/preview)
  let mouseDown=false;
  itemEl.addEventListener('mousedown',e=>{ mouseDown=true; startX=e.clientX; itemEl.style.transition='none'; });
  window.addEventListener('mousemove',e=>{
    if(!mouseDown) return;
    currentX=e.clientX-startX;
    if(currentX>0) currentX=0;
    itemEl.style.transform=`translateX(${currentX}px)`;
  });
  window.addEventListener('mouseup',()=>{
    if(!mouseDown) return;
    mouseDown=false;
    itemEl.style.transition='transform .2s ease';
    if(currentX<threshold){
      itemEl.style.transform=`translateX(-100%)`;
      setTimeout(()=>{ onDelete(); scheduleSave(); },180);
    } else {
      itemEl.style.transform='translateX(0)';
    }
    currentX=0;
  });
}

/* =========================================================
   PERSISTENCIA (IndexedDB)
   Toda la app (recetas, ingredientes, planificador y lista de
   la compra) se guarda en IndexedDB para que los datos
   sobrevivan al cerrar Safari o reiniciar el iPhone.
========================================================= */
const DB_NAME='alimentacion-db';
const DB_STORE='kv';
const STATE_KEY='state';
let _dbPromise=null;

function openDatabase(){
  if(_dbPromise) return _dbPromise;
  _dbPromise=new Promise((resolve,reject)=>{
    if(!('indexedDB' in window)){ reject(new Error('IndexedDB no disponible')); return; }
    const req=indexedDB.open(DB_NAME,1);
    req.onupgradeneeded=(e)=>{
      const db=e.target.result;
      if(!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
    };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
  return _dbPromise;
}
function idbGet(key){
  return openDatabase().then(db=>new Promise((resolve,reject)=>{
    const tx=db.transaction(DB_STORE,'readonly');
    const req=tx.objectStore(DB_STORE).get(key);
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  }));
}
function idbSet(key,value){
  return openDatabase().then(db=>new Promise((resolve,reject)=>{
    const tx=db.transaction(DB_STORE,'readwrite');
    tx.objectStore(DB_STORE).put(value,key);
    tx.oncomplete=()=>resolve();
    tx.onerror=()=>reject(tx.error);
  }));
}

let _saveTimer=null, _saveInFlight=false, _saveAgain=false, _dirty=false;
function scheduleSave(){
  _dirty=true;
  clearTimeout(_saveTimer);
  _saveTimer=setTimeout(flushSave,450);
}
async function flushSave(){
  clearTimeout(_saveTimer);
  if(!_dirty) return;
  if(_saveInFlight){ _saveAgain=true; return; }
  _saveInFlight=true;
  try{
    const snapshot=JSON.parse(JSON.stringify(state));
    await idbSet(STATE_KEY,snapshot);
    _dirty=false;
  }catch(err){
    console.error('No se pudieron guardar los datos',err);
  }finally{
    _saveInFlight=false;
    if(_saveAgain){ _saveAgain=false; flushSave(); }
  }
}
async function loadState(){
  try{
    const saved=await idbGet(STATE_KEY);
    if(saved && typeof saved==='object'){
      state.ingredients = Array.isArray(saved.ingredients)?saved.ingredients:[];
      state.categories = Array.isArray(saved.categories)?saved.categories:[];
      state.recipes = Array.isArray(saved.recipes)?saved.recipes:[];
      state.planner = (saved.planner && typeof saved.planner==='object')?saved.planner:{};
      state.shopping = (saved.shopping && typeof saved.shopping==='object')?saved.shopping:state.shopping;
      state.shopping.recipeEntries = (state.shopping.recipeEntries||[]).map(e=>({...e, excludedIds:Array.isArray(e.excludedIds)?e.excludedIds:[]}));
      state.shopping.manualItems = state.shopping.manualItems||[];
      state.shopping.boughtIngredientIds = state.shopping.boughtIngredientIds||[];
      state.shopping.boughtEntryKeys = state.shopping.boughtEntryKeys||[];
      state.shopping.excludedIngredientIds = state.shopping.excludedIngredientIds||[];
      state.shopping.qtyOverrides = (state.shopping.qtyOverrides && typeof state.shopping.qtyOverrides==='object') ? state.shopping.qtyOverrides : {};
      const savedSettings = (saved.settings && typeof saved.settings==='object') ? saved.settings : {};
      state.settings.shopMode = (savedSettings.shopMode==='recetas') ? 'recetas' : 'agregado';
      state.settings.recipeView = (savedSettings.recipeView==='grid') ? 'grid' : 'list';
      state.settings.showCategories = savedSettings.showCategories!==false;
      return true; // ya había datos guardados
    }
  }catch(err){
    console.error('No se pudieron cargar los datos guardados, se usarán datos de ejemplo',err);
  }
  return false; // no había nada guardado -> primer uso
}

// Red de seguridad: guarda tras cualquier interacción (click/tecleo/gesto),
// al pasar a segundo plano y periódicamente. Esto cubre todas las acciones
// de la app sin tener que instrumentar cada función una a una.
['click','input','change'].forEach(evt=>document.addEventListener(evt,()=>scheduleSave()));
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') flushSave(); });
window.addEventListener('pagehide',()=>flushSave());
window.addEventListener('blur',()=>flushSave());
setInterval(()=>{ if(_dirty) flushSave(); },4000);

/* =========================================================
   FOTOS: selección desde galería/cámara + compresión
========================================================= */
const MAX_PHOTO_DIM=1000;      // lado máximo en píxeles
const PHOTO_QUALITY=0.72;      // calidad JPEG (0-1)

function compressImageFile(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=()=>reject(reader.error);
    reader.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error('Imagen no válida'));
      img.onload=()=>{
        let {width,height}=img;
        if(width>height && width>MAX_PHOTO_DIM){ height=Math.round(height*MAX_PHOTO_DIM/width); width=MAX_PHOTO_DIM; }
        else if(height>=width && height>MAX_PHOTO_DIM){ width=Math.round(width*MAX_PHOTO_DIM/height); height=MAX_PHOTO_DIM; }
        const canvas=document.createElement('canvas');
        canvas.width=width; canvas.height=height;
        const ctx=canvas.getContext('2d');
        ctx.drawImage(img,0,0,width,height);
        resolve(canvas.toDataURL('image/jpeg',PHOTO_QUALITY));
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}

let _photoTargetCallback=null;
const photoFileInput=$('#photo-file-input');
photoFileInput.addEventListener('change',async(e)=>{
  const file=e.target.files && e.target.files[0];
  photoFileInput.value='';
  if(!file || !_photoTargetCallback) return;
  const cb=_photoTargetCallback;
  try{
    const dataUrl=await compressImageFile(file);
    cb(dataUrl);
  }catch(err){
    console.error(err);
    showToast('No se pudo procesar la imagen');
  }
});
// Abre el selector de archivos (en iOS ofrece elegir "Foto o vídeo" / "Elegir archivo",
// lo que permite tanto hacer una foto nueva como elegir una de la galería).
function pickPhoto(onPicked){
  _photoTargetCallback=onPicked;
  photoFileInput.click();
}

/* =========================================================
   COPIA DE SEGURIDAD (exportar / importar)
   Incluye recetas (con sus fotos ya comprimidas), ingredientes
   y categorías. El planificador y la lista de la compra se
   excluyen a propósito, tal y como se pidió.
========================================================= */
function buildBackupPayload(){
  return {
    app:'alimentacion',
    type:'backup',
    version:1,
    exportedAt:new Date().toISOString(),
    categories:state.categories,
    ingredients:state.ingredients,
    recipes:state.recipes
  };
}

function exportBackup(){
  try{
    const json=JSON.stringify(buildBackupPayload(),null,2);
    const blob=new Blob([json],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const stamp=new Date().toISOString().slice(0,10);
    const a=document.createElement('a');
    a.href=url;
    a.download=`alimentacion-backup-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    showToast('Copia de seguridad exportada');
  }catch(err){
    console.error('Error exportando copia de seguridad',err);
    showToast('No se pudo exportar la copia de seguridad');
  }
}

function isValidBackupPayload(obj){
  return !!obj && typeof obj==='object'
    && Array.isArray(obj.recipes) && Array.isArray(obj.ingredients) && Array.isArray(obj.categories);
}

function triggerImportFilePicker(){ $('#backup-file-input').click(); }

$('#backup-file-input').addEventListener('change',(e)=>{
  const file=e.target.files && e.target.files[0];
  e.target.value='';
  if(!file) return;
  const reader=new FileReader();
  reader.onerror=()=>showToast('No se pudo leer el archivo');
  reader.onload=()=>{
    let parsed;
    try{ parsed=JSON.parse(reader.result); }
    catch(err){ showToast('El archivo no es una copia de seguridad válida'); return; }
    if(!isValidBackupPayload(parsed)){ showToast('El archivo no es una copia de seguridad válida'); return; }
    openBackupConfirmSheet(parsed);
  };
  reader.readAsText(file);
});

function openBackupConfirmSheet(payload){
  const dateTxt = payload.exportedAt
    ? new Date(payload.exportedAt).toLocaleString('es-ES',{dateStyle:'medium', timeStyle:'short'})
    : 'fecha desconocida';
  openSheet({
    title:'Restaurar copia de seguridad',
    bodyBuilder:(body)=>{
      body.innerHTML=`
        <p class="subsection-hint">Archivo del ${dateTxt}, con <b style="color:var(--text);">${payload.recipes.length}</b> receta${payload.recipes.length===1?'':'s'} y <b style="color:var(--text);">${payload.ingredients.length}</b> alimento${payload.ingredients.length===1?'':'s'}.</p>
        <p class="subsection-hint">Esta acción no se puede deshacer.</p>
      `;
    },
    footerLabel:'Restaurar',
    onConfirm:()=>{
      state.categories = payload.categories;
      state.ingredients = payload.ingredients;
      state.recipes = payload.recipes;
      renderCategoryChips();
      renderRecipeList();
      showToast('Copia de seguridad restaurada');
    }
  });
}

function openBackupSheet(){
  openSheet({
    title:'Copia de seguridad',
    bodyBuilder:(body)=>{
      body.innerHTML=`
        <button type="button" class="btn btn-primary btn-full" id="backup-export-btn" style="margin-top:6px;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M12 15l-4-4M12 15l4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
          Exportar copia de seguridad
        </button>
        <button type="button" class="btn btn-secondary btn-full" id="backup-import-btn" style="margin-top:10px;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V9M12 9l-4 4M12 9l4 4"/><path d="M4 3v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V3"/></svg>
          Importar copia de seguridad
        </button>
      `;
      body.querySelector('#backup-export-btn').addEventListener('click',()=>{ exportBackup(); closeSheet(); });
      body.querySelector('#backup-import-btn').addEventListener('click',()=>{ closeSheet(); triggerImportFilePicker(); });
    }
  });
}

if('serviceWorker' in navigator){

(function initInstallBanner(){
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const dismissed = localStorage.getItem('installBannerDismissed')==='1';

  if(isIOS && !isStandalone && !dismissed){
    setTimeout(()=>banner.classList.add('show'),1200);

  $('#install-banner-close').addEventListener('click',()=>{
    banner.classList.remove('show');
    localStorage.setItem('installBannerDismissed','1');
  });
})();

/* =========================================================
   GESTO: DESLIZAR DESDE EL BORDE IZQUIERDO PARA VOLVER
   (sólo si el gesto empieza pegado al borde izquierdo)
========================================================= */
(function(){
  const EDGE_WIDTH = 24;          // px desde el borde izquierdo donde puede empezar el gesto
  const CLOSE_RATIO = 0.3;        // hay que arrastrar al menos el 30% del ancho para cerrar
  const CLOSE_VELOCITY = 0.5;     // o ir lo bastante rápido (px/ms) aunque no se llegue al 30%

  const screens = [
    { overlay: '#view-detail',      close: () => closeRecipeDetail() },
    { overlay: '#view-form',        close: () => closeRecipeForm() },
    { overlay: '#view-ingredients', close: () => $('#view-ingredients').classList.remove('open') }
  ];

  screens.forEach(({overlay, close}) => {
    const el = $(overlay);
    if(!el) return;

    let startX=0, startY=0, currentDx=0, dragging=false, startTime=0, width=0, vertical=false;

    el.addEventListener('touchstart', (e) => {
      if(!el.classList.contains('open')) return;
      const t = e.touches[0];
      if(t.clientX > EDGE_WIDTH) return; // sólo si el toque empieza pegado al borde izquierdo
      startX = t.clientX; startY = t.clientY; currentDx = 0;
      startTime = Date.now();
      width = el.offsetWidth;
      dragging = true; vertical = false;
      el.style.transition = 'none';
    }, {passive:true});

    el.addEventListener('touchmove', (e) => {
      if(!dragging || vertical) return;
      const t = e.touches[0];
      const dx = t.clientX - startX;
      const dy = t.clientY - startY;
      if(Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 12){
        // gesto principalmente vertical: lo cancelamos y dejamos hacer scroll normal
        vertical = true; dragging = false;
        el.style.transition = '';
        el.style.transform = '';
        return;
      }
      if(dx <= 0) return; // sólo se puede arrastrar hacia la derecha
      currentDx = dx;
      el.style.transform = `translateX(${dx}px)`;
    }, {passive:true});

    function endDrag(){
      if(!dragging) return;
      dragging = false;
      el.style.transition = '';
      const elapsed = Math.max(1, Date.now() - startTime);
      const velocity = currentDx / elapsed;
      const shouldClose = currentDx > width * CLOSE_RATIO || velocity > CLOSE_VELOCITY;
      if(shouldClose){
        requestAnimationFrame(() => {
          close();
          el.style.transform = '';
        });
      } else {
        el.style.transform = '';
      }
    }

    el.addEventListener('touchend', endDrag);
    el.addEventListener('touchcancel', endDrag);
  });
})();
