<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Alimentación">
<meta name="theme-color" content="#12140F">
<meta name="description" content="Recetas, planificador semanal y lista de la compra.">
<title>Alimentación</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/apple-touch-icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="icons/apple-touch-icon-167.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<style>
:root{
  --bg:#12140F;
  --surface:#1A1D15;
  --surface-2:#22261B;
  --surface-3:#2A2F20;
  --border:rgba(244,242,234,0.08);
  --border-strong:rgba(244,242,234,0.14);
  --text:#F4F2EA;
  --text-dim:#B7B9A9;
  --text-mute:#83867A;
  --accent:#93B25E;
  --accent-dim:#6D8A44;
  --accent-ink:#0E1408;
  --gold:#E3A73A;
  --paprika:#D1613F;
  --radius-s:10px;
  --radius-m:16px;
  --radius-l:24px;
  --radius-xl:30px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-left:env(safe-area-inset-left,0px);
  --safe-right:env(safe-area-inset-right,0px);
  --font-display:'Aptos',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --font-ui:'Aptos',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%; text-size-adjust:100%;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-ui);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
#app{
  position:fixed; inset:0;
  display:flex; flex-direction:column;
  background:
    radial-gradient(120% 60% at 50% -10%, rgba(147,178,94,0.14), transparent 60%),
    var(--bg);
  max-width:560px;
  margin:0 auto;
  isolation:isolate;
  overflow:hidden;
  padding-left:var(--safe-left);
  padding-right:var(--safe-right);
}
@media (orientation:landscape){
  #app{ max-width:100%; }
}
button{font-family:inherit; -webkit-appearance:none; appearance:none; border:none; background:none; color:inherit; cursor:pointer; outline:none;}
input,textarea{font-family:inherit; color:inherit;}
::-webkit-scrollbar{display:none;}

/* ---------- HEADER ---------- */
.app-header{
  padding-top:calc(var(--safe-top) + 10px);
  padding:calc(var(--safe-top) + 10px) 20px 10px;
  flex-shrink:0;
  z-index:5;
  position:relative;
}
.app-header .eyebrow{
  display:none;
}
.app-header h1{
  font-family:var(--font-display);
  font-size:32px; font-weight:600; margin:0;
  letter-spacing:-.01em;
  display:flex; align-items:center; justify-content:flex-end; gap:12px;
}
.app-header h1 #header-title{
  display:none;
}
.header-actions{display:flex; gap:8px; flex-shrink:0;}
.icon-btn{
  width:38px; height:38px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  background:var(--surface-2); border:1px solid var(--border);
  color:var(--text); transition:transform .15s ease, background .15s ease;
}
.icon-btn:active{transform:scale(0.9); background:var(--surface-3);}
.icon-btn svg{width:18px; height:18px;}

/* ---------- MAIN / PANELS ---------- */
.app-main{flex:1; min-height:0; position:relative; overflow-x:hidden;}
.panel{
  position:absolute; inset:0;
  overflow-y:auto; overflow-x:hidden;
  padding:0 20px calc(72px + var(--safe-bottom));
  opacity:0; pointer-events:none; transform:translateY(6px);
  transition:opacity .2s ease, transform .2s ease;
}
.panel.active{opacity:1; pointer-events:auto; transform:none;}

/* ---------- TABBAR ---------- */
.tabbar{
  position:absolute; left:0; right:0; bottom:0;
  display:flex;
  padding:4px calc(var(--safe-right) + 10px) calc(3px + var(--safe-bottom)) calc(var(--safe-left) + 10px);
  background:rgba(20,23,15,0.86);
  backdrop-filter:blur(20px) saturate(160%);
  -webkit-backdrop-filter:blur(20px) saturate(160%);
  border-top:1px solid var(--border);
  z-index:20;
  touch-action:none;
  -webkit-user-select:none;
  user-select:none;
}
.tab-btn{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:2px;
  padding:4px 4px 2px; border-radius:14px; color:var(--text-mute);
  transition:color .15s ease, transform .15s ease;
}
.tab-btn.active{color:var(--accent);}
.tab-btn:active{transform:scale(0.92);}
.tab-btn svg{width:24px; height:24px;}
.tab-btn span{font-size:11px; font-weight:600; letter-spacing:.01em;}

/* ---------- SEARCH ---------- */
.search-bar{
  display:flex; align-items:center; gap:8px;
  background:var(--surface-2); border:1px solid var(--border);
  border-radius:14px; padding:10px 12px; margin-bottom:12px;
}
.search-bar svg{width:17px; height:17px; color:var(--text-mute); flex-shrink:0;}
.search-bar input{
  flex:1; background:none; border:none; outline:none; font-size:15.5px; color:var(--text);
}
.search-bar input::placeholder{color:var(--text-mute);}
.search-bar .clear-btn{
  display:none; flex-shrink:0; width:22px; height:22px; border-radius:50%;
  align-items:center; justify-content:center; color:var(--text-mute); background:var(--surface-3);
}
.search-bar .clear-btn svg{width:11px; height:11px;}
.search-bar.has-value .clear-btn{display:flex;}
.switch-row{display:flex; align-items:center; justify-content:space-between; padding:12px 2px;}
.switch-row .switch-label{font-size:15px; font-weight:600;}
.switch-row .switch-sub{font-size:12.5px; color:var(--text-mute); margin-top:2px;}
.switch{width:46px; height:28px; border-radius:100px; background:var(--surface-3); border:1px solid var(--border-strong); position:relative; flex-shrink:0; transition:background .15s ease;}
.switch::after{content:''; position:absolute; top:2px; left:2px; width:22px; height:22px; border-radius:50%; background:var(--text); transition:transform .18s cubic-bezier(.32,.72,0,1);}
.switch.on{background:var(--accent); border-color:var(--accent);}
.switch.on::after{transform:translateX(18px); background:var(--accent-ink);}

/* ---------- CHIPS ---------- */
.chip-row{
  display:flex; gap:8px; overflow-x:auto; padding-bottom:14px; margin-bottom:2px;
  scroll-snap-type:x proximity;
}
.chip{
  flex-shrink:0; padding:7px 14px; border-radius:100px;
  background:var(--surface-2); border:1px solid var(--border);
  font-size:13.5px; font-weight:600; color:var(--text-dim);
  transition:background .15s ease, color .15s ease, border-color .15s ease;
  white-space:nowrap;
}
.chip.active{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}

/* ---------- RECIPE CARDS ---------- */
.recipe-list{display:flex; flex-direction:column; gap:10px;}
.recipe-card{
  display:flex; gap:12px; align-items:stretch;
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius-l); padding:8px; text-align:left;
  transition:transform .15s ease, background .15s ease;
}
.recipe-card:active{transform:scale(0.985); background:var(--surface-2);}
.recipe-card img{
  width:84px; height:84px; border-radius:var(--radius-m); object-fit:cover; flex-shrink:0;
  background:var(--surface-3);
}
.recipe-card-body{flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; gap:5px; padding:2px 6px 2px 0;}
.recipe-card-title{font-family:var(--font-display); font-size:17.5px; font-weight:600; line-height:1.15; margin:0;}
.recipe-card-meta{display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--text-mute);}
.recipe-card-meta span{display:flex; align-items:center; gap:4px;}
.recipe-card-meta svg{width:13px; height:13px;}
/* ---------- RECIPE GRID VIEW ---------- */
.recipe-list.view-grid{
  display:grid; grid-template-columns:1fr 1fr; gap:12px;
}
.recipe-list.view-grid .recipe-card{
  flex-direction:column; align-items:stretch; padding:0 0 10px; overflow:hidden;
}
.recipe-list.view-grid .recipe-card img{
  width:100%; height:120px; border-radius:var(--radius-l) var(--radius-l) 0 0;
}
.recipe-list.view-grid .recipe-card-body{
  padding:8px 9px 0; justify-content:flex-start; gap:6px;
}
.recipe-list.view-grid .recipe-card-title{
  font-size:15px; -webkit-line-clamp:2; display:-webkit-box; -webkit-box-orient:vertical; overflow:hidden;
}
.tag-row{display:flex; gap:6px; flex-wrap:wrap;}
.tag{
  font-size:10.5px; font-weight:700; letter-spacing:.03em; text-transform:uppercase;
  color:var(--accent); background:rgba(147,178,94,0.14);
  padding:3px 8px; border-radius:100px;
}

.empty-state{
  display:flex; flex-direction:column; align-items:center; text-align:center;
  padding:60px 20px; color:var(--text-mute); gap:10px;
}
.empty-state svg{width:40px; height:40px; opacity:.5;}
.empty-state h3{font-family:var(--font-display); font-size:19px; color:var(--text-dim); margin:0;}
.empty-state p{font-size:14px; margin:0; max-width:260px; line-height:1.5;}

/* ---------- OVERLAY VIEWS (full screen push) ---------- */
.view-overlay{
  position:absolute; inset:0; background:var(--bg); z-index:30;
  display:flex; flex-direction:column;
  transform:translateX(100%); transition:transform .28s cubic-bezier(.32,.72,0,1);
  padding-left:var(--safe-left); padding-right:var(--safe-right);
}
.view-overlay.open{transform:translateX(0);}
.view-header{
  display:flex; align-items:center; gap:10px; flex-shrink:0;
  padding:calc(var(--safe-top) + 12px) 16px 12px;
  border-bottom:1px solid var(--border);
}
.view-header .back-btn{
  width:34px; height:34px; border-radius:50%; background:var(--surface-2);
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.view-header .back-btn svg{width:16px; height:16px;}
.view-header h2{font-family:var(--font-display); font-size:19px; font-weight:600; margin:0; flex:1; min-width:0;}
.view-header .header-actions{margin-left:auto;}
.view-body{flex:1; overflow-y:auto; overflow-x:hidden; padding:0 20px 40px; max-width:100%;}
#view-form, #view-form *{min-width:0;}

/* ---------- RECIPE DETAIL ---------- */
.detail-photo{
  width:calc(100% + 40px); margin:0 -20px; height:230px; object-fit:cover;
  background:var(--surface-2);
}
.detail-title{font-family:var(--font-display); font-size:27px; font-weight:600; margin:16px 0 4px; letter-spacing:-.01em;}
.detail-tags{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px;}
.stat-row{display:flex; gap:10px; margin-bottom:20px;}
.stat-pill{
  flex:1; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m);
  padding:10px 12px; display:flex; flex-direction:column; gap:2px;
}
.stat-pill .stat-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-mute); font-weight:700;}
.stat-pill .stat-value{font-size:15.5px; font-weight:700;}

.servings-control{
  display:flex; align-items:center; justify-content:space-between;
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-l);
  padding:12px 16px; margin-bottom:18px;
}
.servings-control .label{font-size:14px; color:var(--text-dim); font-weight:600;}
.stepper{display:flex; align-items:center; gap:14px;}
.stepper button{
  width:34px; height:34px; border-radius:50%; background:var(--surface-3);
  display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:700;
  border:1px solid var(--border-strong); transition:transform .1s ease, background .15s;
}
.stepper button:active{transform:scale(0.85); background:var(--accent); color:var(--accent-ink);}
.stepper .count{font-size:19px; font-weight:700; min-width:22px; text-align:center; font-variant-numeric:tabular-nums;}

.section-title{
  font-family:var(--font-display); font-size:19px; font-weight:600; margin:22px 0 10px;
  display:flex; align-items:center; justify-content:space-between;
}
.section-title-divider{
  margin:22px 0 10px;
}
.ingredient-row{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:11px 2px;
  font-size:15px;
}
.ingredient-row .qty{color:var(--accent); font-weight:700; font-variant-numeric:tabular-nums; flex-shrink:0;}
.step-item{display:flex; gap:12px; padding:12px 0; align-items:flex-start;}
.step-num{
  width:26px; height:26px; border-radius:50%; background:var(--surface-2); border:1px solid var(--border-strong);
  display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:var(--accent);
  flex-shrink:0; margin-top:1px;
}
.step-text{font-size:15px; line-height:1.55; color:var(--text-dim);}
.step-group-title{
  font-family:var(--font-display); font-size:16.5px; font-weight:600; color:var(--text);
  margin:5px 0 12px; padding-top:8px;
}
.step-group-title:first-child{margin-top:0; padding-top:0;}
.spice-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 2px; font-size:15px;}
.spice-row .amt{color:var(--accent); font-weight:700; flex-shrink:0;}

/* ---------- TABLA DE PASOS (diagrama ingrediente -> operación) ----------
   El contenido de esta tabla ya NO se genera automáticamente: se construye
   a partir del texto manual que el usuario escribe en la edición de la
   receta (ver parseStepsTableText / buildManualStepsTree). */
.steps-table-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch; margin:0 -20px; padding:0 20px;}
table.steps-dgm{
  border-collapse:collapse; border:1px solid var(--border); border-radius:var(--radius-m);
  overflow:hidden; width:100%;
}
table.steps-dgm td{
  border:1px solid var(--border); padding:9px 12px; vertical-align:middle; text-align:center;
}
table.steps-dgm td.st-ing{background:var(--surface); white-space:nowrap; text-align:left;}
td.st-ing .st-ing-name{font-size:13.5px; font-weight:600;}
td.st-op{
  background:rgba(147,178,94,0.26); text-align:center; vertical-align:middle;
  padding:8px 6px;
}
td.st-op .st-op-label{
  font-size:12px; font-weight:700; letter-spacing:.04em; text-transform:lowercase;
  color:var(--accent); line-height:1.3;
}
td.st-global{
  background:rgba(244,242,234,0.10); color:var(--text-dim); font-size:12px; font-style:italic; font-weight:600;
  text-align:center; vertical-align:middle; white-space:normal;
}
td.st-empty{background:var(--surface); min-width:40px;}
/* Cuando un alimento no entra en una o varias columnas seguidas justo
   tras su nombre, esas celdas vacías se fusionan visualmente con la
   celda del nombre (sin borde entre ellas), como si estuvieran
   agrupadas, y el nombre queda alineado a la izquierda. */
td.st-ing.st-ing-merged{border-right:none; text-align:left;}
td.st-empty.st-empty-merged{border-left:none;}
td.st-empty.st-empty-merged-cont{border-right:none;}

/* ---------- Editor manual de la tabla de pasos (formulario) ---------- */
.field-label-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:0;}
.field-label-row label{margin:0;}
.help-btn-sm{
  width:22px; height:22px; border-radius:50%; background:var(--surface-2); border:1px solid var(--border-strong);
  color:var(--text-mute); font-size:12.5px; font-weight:700; display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
}
.help-btn-sm:active{background:var(--surface-3);}
.steps-table-editor{
  width:100%; min-height:280px; background:var(--surface-2); border:1px solid var(--border-strong);
  border-radius:var(--radius-s); padding:12px 13px; font-size:13.5px; line-height:1.6; color:var(--text);
  outline:none; resize:none; overflow:hidden; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
.steps-table-editor:focus{border-color:var(--accent);}
.steps-table-hint{font-size:12px; color:var(--text-mute); margin:8px 0 0; line-height:1.5;}
.help-sheet-body p{font-size:14px; line-height:1.55; color:var(--text-dim); margin:0 0 10px;}
.help-sheet-body ul{margin:0 0 14px; padding-left:18px;}
.help-sheet-body li{font-size:13.5px; line-height:1.6; color:var(--text-dim); margin-bottom:6px;}
.help-sheet-body code, .steps-table-hint code{
  background:var(--surface-2); border:1px solid var(--border); border-radius:4px; padding:1px 5px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12.5px; color:var(--accent);
}
.help-sheet-example{
  background:var(--surface-2); border:1px solid var(--border-strong); border-radius:var(--radius-s);
  padding:10px 12px; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12px;
  line-height:1.7; color:var(--text-dim); white-space:pre-wrap; word-break:break-word;
}

.detail-actions{display:flex; gap:10px; margin-top:24px; padding-bottom:10px;}
.btn{
  flex:1; padding:13px 14px; border-radius:var(--radius-m); font-size:14.5px; font-weight:700;
  display:flex; align-items:center; justify-content:center; gap:6px;
  transition:transform .12s ease;
}
.btn:active{transform:scale(0.96);}
.btn-primary{background:var(--accent); color:var(--accent-ink);}
.btn-secondary{background:var(--surface-2); color:var(--text); border:1px solid var(--border-strong);}
.btn svg{width:16px; height:16px;}
.btn-full{width:100%;}
.btn-ghost-danger{background:rgba(209,97,63,0.12); color:var(--paprika);}

/* ---------- FORMS ---------- */
.field{margin-bottom:16px;}
.field label{display:block; font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--text-mute); margin-bottom:7px;}
.field input[type=text], .field input[type=number], .field input[type=url], .field textarea{
  width:100%; background:var(--surface); border:1px solid var(--border-strong); border-radius:var(--radius-m);
  padding:12px 13px; font-size:15px; outline:none; color:var(--text);
}
.field textarea{resize:vertical; min-height:70px; line-height:1.5;}
.field input:focus, .field textarea:focus{border-color:var(--accent);}
.two-col{display:flex; gap:10px; min-width:0;}
.two-col .field{flex:1; min-width:0;}
.chip-select-row{display:flex; gap:8px; flex-wrap:wrap;}

/* Filas dinámicas (ingredientes / especias / pasos): apiladas para que el
   campo principal tenga todo el ancho disponible y no se corte en pantallas
   estrechas. */
.dyn-card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m);
  padding:10px 10px 12px; margin-bottom:9px;
}
.dyn-card-top{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
.dyn-card-top .autocomplete-box{flex:1; min-width:0;}
.dyn-card-top input.ing-name-input{
  width:100%; font-size:15.5px; font-weight:600; padding:11px 12px;
  background:var(--surface-2); border:1px solid var(--border-strong); border-radius:var(--radius-s);
  outline:none; color:var(--text);
}
.dyn-card-top input.ing-name-input:focus{border-color:var(--accent);}
.dyn-card-bottom{display:flex; gap:8px; align-items:center;}
.field .dyn-card-bottom input.qty-input{flex:1 1 0; min-width:0; width:auto;}
.field .dyn-card-bottom input.unit-input{flex:1 1 0; min-width:0; width:auto;}
.field .dyn-card-bottom input.amount-input{flex:1 1 auto; min-width:0; width:auto;}
.dyn-card-bottom input{
  background:var(--surface-2); border:1px solid var(--border-strong); border-radius:var(--radius-s);
  padding:9px 10px; font-size:14px; color:var(--text); outline:none;
}
.field .dyn-card-bottom input:focus{border-color:var(--accent);}
.dyn-card-bottom .amount-suffix{font-size:12.5px; color:var(--text-mute); flex-shrink:0; white-space:nowrap;}
.remove-row-btn{
  width:32px; height:32px; border-radius:50%; background:var(--surface-2); color:var(--paprika);
  display:flex; align-items:center; justify-content:center; flex-shrink:0; border:1px solid var(--border);
}
.remove-row-btn svg{width:14px; height:14px;}
.add-row-btn{
  display:flex; align-items:center; gap:6px; font-size:13.5px; font-weight:700; color:var(--accent);
  padding:8px 2px;
}
.add-row-btn svg{width:15px; height:15px;}
.subsection-hint{font-size:12.5px; color:var(--text-mute); margin:-4px 0 10px; line-height:1.5;}

/* Pasos con títulos de grupo */
.step-card{display:flex; align-items:center; gap:6px; margin-bottom:9px;}
.step-card > .dyn-card{flex:1; min-width:0; margin-bottom:0;}
.step-card.is-heading .dyn-card{background:var(--surface-2); border-color:var(--border-strong);}
.step-type-toggle{
  display:flex; gap:6px; margin-bottom:8px;
}
.step-type-toggle button{
  flex:1; padding:6px 8px; border-radius:8px; font-size:11.5px; font-weight:700; text-transform:uppercase;
  letter-spacing:.03em; color:var(--text-mute); background:var(--surface-2); border:1px solid var(--border);
}
.step-type-toggle button.active{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
.step-card textarea{
  width:100%; background:var(--surface-2); border:1px solid var(--border-strong); border-radius:var(--radius-s);
  padding:10px 12px; font-size:14.5px; color:var(--text); outline:none; resize:none; overflow:hidden; min-height:44px; line-height:1.5;
}
.step-card.is-heading textarea{font-family:var(--font-display); font-size:16.5px; font-weight:600; min-height:44px;}
.step-card textarea:focus{border-color:var(--accent);}

/* Categorías: chips seleccionadas + botón para abrir selector */
.category-picker-btn{
  display:flex; align-items:center; justify-content:space-between; width:100%;
  background:var(--surface); border:1px solid var(--border-strong); border-radius:var(--radius-m);
  padding:12px 13px; font-size:14.5px; color:var(--text-mute); font-weight:600;
}
.category-picker-btn svg{width:16px; height:16px; flex-shrink:0;}
.selected-chip-row{display:flex; gap:7px; flex-wrap:wrap; margin-top:10px;}
.selected-chip{
  display:flex; align-items:center; gap:6px; background:rgba(147,178,94,0.14); color:var(--accent);
  font-size:12.5px; font-weight:700; padding:6px 8px 6px 12px; border-radius:100px;
}
.selected-chip button{display:flex; color:var(--accent); opacity:.8;}
.selected-chip button svg{width:12px; height:12px;}
.cat-sel-row{display:flex; align-items:center; gap:10px; padding:10px 2px; border-bottom:1px solid var(--border);}
.cat-sel-row:last-child{border-bottom:none;}
.cat-sel-row .name{flex:1; min-width:0; font-size:15px; font-weight:600;}
.cat-sel-row .actions{display:flex; gap:4px; flex-shrink:0;}
.cat-sel-row .actions button{
  width:28px; height:28px; border-radius:50%; background:var(--surface-2); display:flex; align-items:center; justify-content:center; color:var(--text-mute);
}
.cat-sel-row .actions button svg{width:13px; height:13px;}
.create-cat-row{
  display:flex; align-items:center; gap:8px; padding:11px 2px; color:var(--accent); font-weight:700; font-size:14.5px;
  border-bottom:1px solid var(--border);
}
.create-cat-row svg{width:16px; height:16px; flex-shrink:0;}
.spice-tag{
  font-size:9.5px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; color:var(--gold);
  background:rgba(227,167,58,0.15); padding:2px 6px; border-radius:100px; margin-left:6px;
}
.ing-master-row .actions button.disabled{opacity:.3; pointer-events:none;}

/* ---------- REORDENAR (arrastrar y soltar) ---------- */
.drag-handle{
  width:30px; height:36px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
  color:var(--text-mute); touch-action:none; cursor:grab;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
}
.drag-handle svg{width:16px; height:16px; pointer-events:none;}
.sortable-item{touch-action:pan-y;}
.sortable-item.sortable-dragging{
  position:relative; z-index:30; cursor:grabbing;
  box-shadow:0 10px 24px rgba(0,0,0,.35); border-radius:var(--radius-m);
  -webkit-user-select:none; user-select:none;
}
.sortable-item.sortable-dragging .drag-handle{cursor:grabbing;}
.sortable-shift{transition:transform .16s ease;}
body.sortable-active, body.sortable-active *{-webkit-user-select:none !important; user-select:none !important;}

/* ---------- GESTIÓN DE CATEGORÍAS ---------- */
.cat-manage-row{display:flex; align-items:center; gap:6px; padding:4px 0 4px 0; border-bottom:1px solid var(--border);}
.cat-manage-row:last-child{border-bottom:none;}
.cat-manage-row .name{flex:1; min-width:0; font-size:15px; font-weight:600; padding:8px 0;}
.cat-manage-row .actions{display:flex; gap:4px; flex-shrink:0;}
.cat-manage-row .actions button{
  width:30px; height:30px; border-radius:50%; background:var(--surface-2); display:flex; align-items:center; justify-content:center; color:var(--text-mute);
}
.cat-manage-row .actions button svg{width:14px; height:14px;}

/* ---------- POPUP DE CONFIRMACIÓN ---------- */
.confirm-backdrop{
  position:fixed; inset:0; z-index:210; background:rgba(6,7,4,0.72);
  display:flex; align-items:center; justify-content:center; padding:24px;
  opacity:0; pointer-events:none; transition:opacity .2s ease;
}
.confirm-backdrop.open{opacity:1; pointer-events:auto;}
.confirm-dialog{
  width:100%; max-width:320px; background:var(--surface-2); border:1px solid var(--border-strong);
  border-radius:var(--radius-l); padding:22px 20px 18px; box-shadow:0 20px 50px rgba(0,0,0,.5);
  transform:scale(.94); transition:transform .2s ease;
}
.confirm-backdrop.open .confirm-dialog{transform:scale(1);}
.confirm-dialog h3{font-family:var(--font-display); font-size:18px; font-weight:700; margin:0 0 8px;}
.confirm-dialog p{font-size:14px; color:var(--text-dim); line-height:1.5; margin:0 0 20px;}
.confirm-actions{display:flex; gap:10px;}
.confirm-actions .btn{flex:1;}
.photo-picker{
  width:100%; height:150px; border-radius:var(--radius-m); border:1.5px dashed var(--border-strong);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  color:var(--text-mute); font-size:13px; overflow:hidden; position:relative; background:var(--surface);
}
.photo-picker img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
.photo-picker.is-busy{color:var(--text-mute);}
.photo-picker .ph-spinner{
  width:22px; height:22px; border-radius:50%;
  border:2.5px solid var(--border-strong); border-top-color:var(--accent);
  animation:ph-spin .8s linear infinite;
}
@keyframes ph-spin{to{transform:rotate(360deg);}}
.photo-actions{display:flex; gap:8px; margin-top:8px;}
.photo-actions button{
  flex:1; display:flex; align-items:center; justify-content:center; gap:6px;
  padding:9px 10px; border-radius:var(--radius-s); background:var(--surface-2); border:1px solid var(--border);
  font-size:12.5px; font-weight:600; color:var(--text-dim);
}
.photo-actions button svg{width:14px; height:14px;}
.photo-actions button.danger{color:var(--paprika);}
.photo-actions button:active{background:var(--surface-3);}

/* ---------- INSTALL BANNER (iOS) ---------- */
.install-banner{
  position:absolute; left:12px; right:12px; bottom:calc(70px + var(--safe-bottom));
  background:var(--surface-2); border:1px solid var(--border-strong); border-radius:var(--radius-m);
  padding:13px 14px; display:flex; gap:11px; align-items:flex-start;
  box-shadow:0 14px 30px rgba(0,0,0,.4); z-index:20;
  transform:translateY(12px); opacity:0; pointer-events:none;
  transition:opacity .25s ease, transform .25s ease;
}
.install-banner.show{opacity:1; transform:none; pointer-events:auto;}
.install-banner .ib-icon{
  width:34px; height:34px; border-radius:10px; background:var(--surface-3); flex-shrink:0;
  display:flex; align-items:center; justify-content:center; color:var(--accent);
}
.install-banner .ib-icon svg{width:18px; height:18px;}
.install-banner .ib-body{flex:1; min-width:0;}
.install-banner .ib-title{font-size:13.5px; font-weight:700; margin:0 0 3px;}
.install-banner .ib-text{font-size:12.5px; color:var(--text-dim); line-height:1.4; margin:0;}
.install-banner .ib-text b{color:var(--text);}
.install-banner .ib-close{
  flex-shrink:0; width:24px; height:24px; border-radius:50%; background:var(--surface-3);
  display:flex; align-items:center; justify-content:center; color:var(--text-mute);
}
.install-banner .ib-close svg{width:11px; height:11px;}
.autocomplete-box{
  position:relative;
}
.ac-suggestions{
  position:absolute; left:0; right:0; top:calc(100% + 4px); z-index:5;
  background:var(--surface-3); border:1px solid var(--border-strong); border-radius:var(--radius-m);
  max-height:150px; overflow-y:auto; box-shadow:0 12px 24px rgba(0,0,0,.4);
}
.ac-suggestions div{padding:10px 13px; font-size:14px; border-bottom:1px solid var(--border);}
.ac-suggestions div:last-child{border-bottom:none;}
.ac-suggestions div:active{background:var(--surface-2);}

/* ---------- PLANNER ---------- */
.week-nav{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
.week-nav button:not(.week-label){
  width:36px; height:36px; border-radius:50%; background:var(--surface-2); border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.week-nav button:not(.week-label) svg{width:16px; height:16px;}
.week-nav{position:sticky; top:0; z-index:5; padding-top:14px; margin-top:-14px; padding-bottom:14px;
  background:var(--bg);}
.week-nav::after{
  content:''; position:absolute; left:0; right:0; top:100%; height:14px;
  background:linear-gradient(var(--bg), transparent); pointer-events:none;
}
.week-label{text-align:center; border-radius:12px; padding:4px 10px; transition:background .15s ease;
  display:flex; flex-direction:column; align-items:center; flex:1; min-width:0; -webkit-tap-highlight-color:transparent;}
.week-label:active{background:var(--surface-2);}
.week-label .range-row{display:flex; align-items:center; justify-content:center; gap:5px; width:100%; min-width:0;}
.week-label .range{font-size:15px; font-weight:700; white-space:normal; line-height:1.25;}
.week-label .range-row svg{width:12px; height:12px; color:var(--text-mute); flex-shrink:0;}
.week-label .tag{margin-top:3px; display:inline-block;}

/* ---------- CALENDAR PICKER ---------- */
.cal-picker{padding-bottom:4px;}
.cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
.cal-head .cal-month{font-family:var(--font-display); font-size:16px; font-weight:700; text-transform:capitalize;}
.cal-nav{
  width:34px; height:34px; border-radius:50%; background:var(--surface-2); border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.cal-nav svg{width:15px; height:15px;}
.cal-weekdays{display:grid; grid-template-columns:repeat(7,1fr); text-align:center; margin-bottom:4px;}
.cal-weekdays span{font-size:11.5px; font-weight:700; color:var(--text-mute);}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); row-gap:4px;}
.cal-day{
  aspect-ratio:1; display:flex; align-items:center; justify-content:center; margin:0 auto; width:36px; max-width:100%;
  border-radius:50%; font-size:14px; font-weight:600; color:var(--text);
}
.cal-day.out{color:var(--text-mute); opacity:.45;}
.cal-day.cal-sel{background:var(--surface-3);}
.cal-day.cal-today{color:var(--accent); font-weight:800;}
.cal-day.cal-sel.cal-today{background:var(--accent); color:var(--accent-ink);}
.cal-today-btn{margin-top:16px;}
.day-block{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-l);
  padding:14px 14px 10px; margin-bottom:12px;
}
.day-block.today{border-color:var(--accent);}
.day-block-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:10px;}
.day-name{font-family:var(--font-display); font-size:17px; font-weight:600;}
.day-date{font-size:12.5px; color:var(--text-mute); font-weight:600;}
.day-entry{
  display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px solid var(--border);
}
.day-entry-recipe{cursor:pointer;}
.day-entry-recipe:active{background:var(--surface-2); border-radius:10px;}
.day-entry img{width:38px; height:38px; border-radius:10px; object-fit:cover; flex-shrink:0; background:var(--surface-3);}
.day-entry .placeholder-icon{
  width:38px; height:38px; border-radius:10px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--gold);
}
.day-entry .placeholder-icon svg{width:17px; height:17px;}
.day-entry .txt{flex:1; min-width:0; font-size:14.5px; font-weight:600;}
.day-entry .txt small{display:block; font-size:11.5px; font-weight:500; color:var(--text-mute); margin-top:1px;}
.day-entry .del-entry{color:var(--text-mute); flex-shrink:0; padding:4px;}
.day-entry .del-entry svg{width:15px; height:15px;}
.add-entry-btn{
  display:flex; align-items:center; gap:6px; padding:10px 0 4px; font-size:13.5px; font-weight:700; color:var(--accent);
  width:100%; border-top:1px solid var(--border); margin-top:2px;
}
.add-entry-btn svg{width:15px; height:15px;}

/* ---------- SHOPPING LIST ---------- */
#panel-compra.panel{display:flex; flex-direction:column;}
#shop-list{flex:1; display:flex; flex-direction:column;}
#shop-list.shop-list-empty{align-items:center; justify-content:center;}
#shop-list.shop-list-empty .empty-state{padding:0;}
.shop-toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
.shop-toolbar .count-label{font-size:13.5px; color:var(--text-mute); font-weight:600;}
.shop-toolbar .clear-all{font-size:13px; font-weight:700; color:var(--paprika);}
.shop-seg{display:flex; background:var(--surface-2); border-radius:12px; padding:3px; margin-bottom:14px;}
#steps-view-seg{margin-top:22px;}
#steps-view-body{margin-bottom:16px;}
.shop-seg-btn{flex:1; padding:10px; border-radius:9px; font-size:14px; font-weight:700; color:var(--text-mute);}
.shop-seg-btn.active{background:var(--accent); color:var(--accent-ink);}
.swipe-wrap.recipe-wrap{border-radius:var(--radius-l); margin-bottom:12px;}
.swipe-wrap.recipe-wrap .shop-recipe-card{margin-bottom:0;}
.shop-recipe-card{
  position:relative; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-l);
  padding:12px 14px 14px; margin-bottom:12px;
}
.qty-editable{cursor:pointer; text-decoration:underline dotted; text-underline-offset:3px;}
.qty-editable:active{opacity:.6;}
.shop-recipe-head{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
.shop-recipe-head img{width:44px; height:44px; border-radius:10px; object-fit:cover; flex-shrink:0; background:var(--surface-3);}
.shop-recipe-head .n{flex:1; min-width:0; font-family:var(--font-display); font-size:16px; font-weight:600;}
.shop-recipe-head .del-recipe-entry{color:var(--text-mute); flex-shrink:0; padding:4px;}
.shop-recipe-head .del-recipe-entry svg{width:16px; height:16px;}
.shop-recipe-servings{
  display:flex; align-items:center; justify-content:space-between; background:var(--surface-2);
  border-radius:var(--radius-s); padding:8px 10px; margin-bottom:8px;
}
.shop-recipe-servings .lbl{font-size:12.5px; color:var(--text-mute); font-weight:600;}
.shop-recipe-servings .stepper button{width:26px; height:26px; font-size:15px;}
.shop-recipe-servings .stepper .count{font-size:14.5px; min-width:16px;}
.shop-recipe-ing-row{display:flex; align-items:center; gap:10px; padding:7px 2px; font-size:14px;}
.shop-recipe-ing-row .n{flex:1; min-width:0;}
.shop-recipe-ing-row .qty{color:var(--accent); font-weight:700; flex-shrink:0; font-variant-numeric:tabular-nums;}
.shop-recipe-ing-row.bought .n{text-decoration:line-through; color:var(--text-mute);}
.shop-recipe-ing-row.bought .qty{color:var(--text-mute); text-decoration:line-through;}
.shop-recipe-ing-row .del-ing-row{color:var(--text-mute); flex-shrink:0; padding:4px;}
.shop-recipe-ing-row .del-ing-row svg{width:14px; height:14px;}
.shop-other-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-l); padding:6px 14px; margin-bottom:12px;}
.shop-other-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 0; border-bottom:1px solid var(--border); font-size:14.5px;}
.shop-other-row:last-child{border-bottom:none;}
.shop-other-row button{color:var(--text-mute); flex-shrink:0; padding:4px;}
.shop-other-row button svg{width:15px; height:15px;}
.shop-group-label{font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--text-mute); margin:6px 2px 8px;}
.swipe-wrap{position:relative; border-radius:var(--radius-m); overflow:hidden; margin-bottom:9px;}
.swipe-del{
  position:absolute; inset:0; background:var(--paprika); display:flex; align-items:center; justify-content:flex-end;
  padding-right:20px; color:#fff; font-weight:700; font-size:14px;
}
.swipe-del svg{width:18px; height:18px;}
.shop-item{
  position:relative; background:var(--surface); border:1px solid var(--border);
  padding:13px 14px; display:flex; align-items:flex-start; gap:12px;
  transition:transform .18s ease;
  touch-action:pan-y;
}
.shop-check{
  width:23px; height:23px; border-radius:50%; border:2px solid var(--border-strong); flex-shrink:0; margin-top:1px;
  display:flex; align-items:center; justify-content:center; transition:background .15s, border-color .15s;
}
.shop-check svg{width:13px; height:13px; opacity:0;}
.shop-item.bought .shop-check{background:var(--accent); border-color:var(--accent);}
.shop-item.bought .shop-check svg{opacity:1; color:var(--accent-ink);}
.shop-item.partial .shop-check{border-color:var(--accent); background:conic-gradient(var(--accent) var(--partial-pct,50%), transparent 0);}
.shop-item-body{flex:1; min-width:0;}
.shop-item-row{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
.shop-item-left{flex:1; min-width:0;}
.shop-item-right{flex-shrink:0; text-align:right;}
.shop-item-name{font-size:15.5px; font-weight:700;}
.shop-item.bought .shop-item-name, .shop-item.bought .shop-breakdown{text-decoration:line-through; color:var(--text-mute);}
.shop-item-right .total{color:var(--accent); font-weight:700; font-variant-numeric:tabular-nums; font-size:15.5px;}
.shop-item.bought .shop-item-right .total{color:var(--text-mute);}
.shop-item-right .total.partial-total{color:var(--text-mute); text-decoration:line-through;}
.shop-breakdown{font-size:12.5px; color:var(--text-mute); margin-top:3px; line-height:1.5;}
.shop-remaining-note{font-size:15.5px; color:var(--accent); margin-top:3px; font-weight:700; font-variant-numeric:tabular-nums;}

/* ---------- BOTTOM SHEET ---------- */
.sheet-backdrop{
  position:absolute; inset:0; background:rgba(0,0,0,0.5); z-index:40; opacity:0; pointer-events:none;
  transition:opacity .2s ease;
}
.sheet-backdrop.open{opacity:1; pointer-events:auto;}
.sheet{
  position:absolute; left:0; right:0; bottom:0; z-index:41;
  background:var(--surface); border-radius:24px 24px 0 0; border:1px solid var(--border-strong); border-bottom:none;
  max-height:82%; display:flex; flex-direction:column;
  transform:translateY(100%); transition:transform .28s cubic-bezier(.32,.72,0,1);
  padding-bottom:var(--safe-bottom);
  padding-left:var(--safe-left); padding-right:var(--safe-right);
}
.sheet.open{transform:translateY(0);}
.sheet-handle{width:36px; height:4px; background:var(--border-strong); border-radius:100px; margin:10px auto 4px;}
.sheet-head{padding:6px 20px 12px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border);}
.sheet-head h3{font-family:var(--font-display); font-size:18px; font-weight:600; margin:0;}
.sheet-head button{font-size:14px; font-weight:700; color:var(--accent);}
.sheet-body{overflow-y:auto; padding:14px 20px 20px;}
.sheet-footer{padding:12px 20px; border-top:1px solid var(--border);}
.recipe-menu-wrap{position:relative;}
.recipe-menu-dropdown{
  position:absolute; top:calc(100% + 8px); right:0; z-index:30;
  display:flex; flex-direction:column; align-items:center; gap:10px;
  opacity:0; transform:translateY(-8px); pointer-events:none; transition:opacity .16s ease, transform .16s ease;
}
.recipe-menu-dropdown.open{opacity:1; transform:translateY(0); pointer-events:auto;}

.sel-row{display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--border);}
.sel-row:last-child{border-bottom:none;}
.sel-check{
  width:22px; height:22px; border-radius:7px; border:2px solid var(--border-strong); flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
}
.sel-check svg{width:12px; height:12px; opacity:0;}
.sel-row.checked .sel-check{background:var(--accent); border-color:var(--accent);}
.sel-row.checked .sel-check svg{opacity:1; color:var(--accent-ink);}
.sel-row-body{flex:1; min-width:0; font-size:14.5px; font-weight:600;}
.sel-row-body .sub{font-size:12px; color:var(--text-mute); font-weight:500;}
.qty-inline{display:flex; align-items:center; gap:6px; flex-shrink:0;}
.qty-inline input{
  width:52px; text-align:center; background:var(--surface-2); border:1px solid var(--border-strong); border-radius:8px;
  padding:6px 4px; font-size:13.5px; color:var(--text);
}
.qty-inline .unit{font-size:12px; color:var(--text-mute); width:34px;}
.pick-row{display:flex; align-items:center; gap:12px; padding:11px 4px; border-radius:var(--radius-m);}
.pick-row img{width:44px; height:44px; border-radius:10px; object-fit:cover; flex-shrink:0; background:var(--surface-3);}
.pick-row .n{font-size:14.5px; font-weight:700;}
.pick-row:active{background:var(--surface-2);}
.seg-control{display:flex; background:var(--surface-2); border-radius:12px; padding:3px; margin-bottom:16px;}
.seg-control button{flex:1; padding:9px; border-radius:9px; font-size:13.5px; font-weight:700; color:var(--text-mute);}
.seg-control button.active{background:var(--accent); color:var(--accent-ink);}
.day-picker-row{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:16px;}
.day-picker-chip{
  flex-shrink:0; padding:10px 6px; width:52px; border-radius:14px; background:var(--surface-2); border:1px solid var(--border);
  text-align:center;
}
.day-picker-chip.active{background:var(--accent); border-color:var(--accent);}
.day-picker-chip.active .dp-name, .day-picker-chip.active .dp-num{color:var(--accent-ink);}
.day-picker-chip .dp-name{display:block; font-size:10.5px; font-weight:700; text-transform:uppercase; color:var(--text-mute);}
.day-picker-chip .dp-num{display:block; font-size:15px; font-weight:700; margin-top:2px;}

.ing-master-row{display:flex; align-items:center; gap:10px; padding:12px 2px; border-bottom:1px solid var(--border);}
.ing-master-row .n{flex:1; font-size:15px; font-weight:600;}
.ing-master-row .cnt{font-size:12px; color:var(--text-mute); flex-shrink:0;}
.ing-master-row .actions{display:flex; gap:4px; flex-shrink:0;}
.ing-master-row .actions button{
  width:30px; height:30px; border-radius:50%; background:var(--surface-2); display:flex; align-items:center; justify-content:center; color:var(--text-mute);
}
.ing-master-row .actions button svg{width:14px; height:14px;}

.toast{
  position:absolute; left:50%; bottom:calc(96px + var(--safe-bottom)); transform:translate(-50%,10px);
  background:var(--surface-3); border:1px solid var(--border-strong); color:var(--text);
  padding:11px 18px; border-radius:100px; font-size:13.5px; font-weight:600; z-index:60;
  opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease;
  display:flex; align-items:center; gap:8px; white-space:nowrap; box-shadow:0 10px 26px rgba(0,0,0,.4);
}
.toast.show{opacity:1; transform:translate(-50%,0);}
.toast svg{width:15px; height:15px; color:var(--accent);}

/* ---------- PHOTO LIGHTBOX ---------- */
.photo-lightbox{
  position:fixed; inset:0; background:rgba(6,7,4,0.94);
  display:flex; align-items:center; justify-content:center;
  padding:calc(var(--safe-top) + 20px) calc(var(--safe-right) + 20px) calc(var(--safe-bottom) + 20px) calc(var(--safe-left) + 20px);
  z-index:200; opacity:0; pointer-events:none; transition:opacity .2s ease;
}
.photo-lightbox.open{opacity:1; pointer-events:auto;}
.photo-lightbox img{max-width:100%; max-height:100%; border-radius:var(--radius-m); object-fit:contain;}
.photo-lightbox-close{
  position:absolute; top:calc(var(--safe-top) + 14px); right:calc(var(--safe-right) + 20px);
  width:38px; height:38px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  background:rgba(244,242,234,0.1); color:var(--text);
}
.photo-lightbox-close svg{width:18px; height:18px;}

/* ---------- TABLE LIGHTBOX (tabla de pasos a pantalla completa) ---------- */
.steps-table-wrap{position:relative; cursor:pointer;}
.table-lightbox{
  position:fixed; inset:0; background:rgba(6,7,4,0.97);
  z-index:210; opacity:0; pointer-events:none; transition:opacity .2s ease;
  display:flex; flex-direction:column;
}
.table-lightbox.open{opacity:1; pointer-events:auto;}
.table-lightbox-close{
  position:absolute; top:calc(var(--safe-top) + 14px); right:calc(var(--safe-right) + 20px); z-index:2;
  width:38px; height:38px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  background:rgba(244,242,234,0.1); color:var(--text);
}
.table-lightbox-close svg{width:18px; height:18px;}
.table-lightbox-scroll{
  flex:1; overflow:auto; -webkit-overflow-scrolling:touch;
  padding:calc(var(--safe-top) + 64px) calc(var(--safe-right) + 20px) calc(var(--safe-bottom) + 30px) calc(var(--safe-left) + 20px);
  touch-action:pan-x pan-y;
}
.table-lightbox-scroll .steps-table-wrap{margin:0; padding:0; overflow:visible; cursor:default;}
.table-lightbox-scroll table.steps-dgm{width:max-content; min-width:100%; transform-origin:0 0; transition:transform .05s linear;}
.table-lightbox-scroll table.steps-dgm td{padding:14px 20px; font-size:15px;}
.table-lightbox-scroll td.st-ing .st-ing-name{font-size:15px;}
.table-lightbox-scroll td.st-op .st-op-label{font-size:12.5px;}
.table-lightbox-scroll table.steps-dgm td.st-global{font-size:12.5px;}
.table-lightbox-scroll td.st-op,
.table-lightbox-scroll td.st-global{
  -webkit-transform:translateZ(0); transform:translateZ(0);
}
.table-lightbox-scroll table.steps-dgm td.st-op{background:rgba(147,178,94,0.26);}
.table-lightbox-scroll table.steps-dgm td.st-global{background:rgba(244,242,234,0.10); color:var(--text-dim);}
</style>

<body>

<script>
(function(){
"use strict";

/* =========================================================
   UTILIDADES
========================================================= */
const $ = (sel,ctx=document)=>ctx.querySelector(sel);
const $$ = (sel,ctx=document)=>Array.from(ctx.querySelectorAll(sel));
const uid = (p='id')=>p+'_'+Math.random().toString(36).slice(2,9);
const DAY_NAMES = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const DAY_SHORT = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const MONTHS = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

function normalize(str){
  return (str||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
}
function fmtQty(n){
  if(n===null||n===undefined) return '';
  const r = Math.round(n*100)/100;
  return (r % 1 === 0) ? String(r) : r.toFixed(2).replace(/0+$/,'').replace(/\.$/,'');
}
function mondayOf(date){
  const d = new Date(date);
  const day = (d.getDay()+6)%7; // 0=lunes
  d.setDate(d.getDate()-day);
  d.setHours(0,0,0,0);
  return d;
}
function addDays(date,n){ const d=new Date(date); d.setDate(d.getDate()+n); return d; }
function dateKey(date){ return date.toISOString().slice(0,10); }
function showToast(msg){
  const t=$('#toast'); $('#toast-text').textContent=msg; t.classList.add('show');
  clearTimeout(showToast._tm);
  showToast._tm=setTimeout(()=>t.classList.remove('show'),2000);
}
function openPhotoLightbox(src){
  if(!src) return;
  $('#photo-lightbox-img').src=src;
  $('#photo-lightbox').classList.add('open');
}
function closePhotoLightbox(){ $('#photo-lightbox').classList.remove('open'); }
$('#photo-lightbox').addEventListener('click',closePhotoLightbox);
$('#photo-lightbox-close').addEventListener('click',closePhotoLightbox);
function openTableLightbox(tableEl){
  if(!tableEl) return;
  $('#table-lightbox-scroll').innerHTML = `<div class="steps-table-wrap">${tableEl.outerHTML}</div>`;
  resetTableLightboxZoom();
  $('#table-lightbox').classList.add('open');
}
function closeTableLightbox(){
  $('#table-lightbox').classList.remove('open');
  $('#table-lightbox-scroll').innerHTML='';
}
$('#table-lightbox').addEventListener('click',e=>{ if(e.target.id==='table-lightbox' || e.target.id==='table-lightbox-scroll') closeTableLightbox(); });
$('#table-lightbox-close').addEventListener('click',closeTableLightbox);

// Zoom por gesto de pellizco (pinch) dentro del visor de tabla a pantalla
// completa. Usamos la propiedad CSS "zoom" (en vez de transform:scale) para
// que el tamaño de scroll del contenedor crezca de verdad y se pueda
// desplazar por toda la tabla ampliada.
let tableLightboxZoom = 1;
let tableLightboxPinchStartDist = null;
let tableLightboxPinchStartZoom = 1;
function resetTableLightboxZoom(){
  tableLightboxZoom = 1;
  tableLightboxPinchStartDist = null;
}
function touchDist(t0,t1){ return Math.hypot(t0.clientX-t1.clientX, t0.clientY-t1.clientY); }
(function(){
  const scrollEl = $('#table-lightbox-scroll');
  scrollEl.addEventListener('touchstart',e=>{
    if(e.touches.length===2){
      tableLightboxPinchStartDist = touchDist(e.touches[0], e.touches[1]);
      tableLightboxPinchStartZoom = tableLightboxZoom;
    }
  },{passive:true});
  scrollEl.addEventListener('touchmove',e=>{
    if(e.touches.length===2 && tableLightboxPinchStartDist){
      const d = touchDist(e.touches[0], e.touches[1]);
      let z = tableLightboxPinchStartZoom * (d / tableLightboxPinchStartDist);
      z = Math.min(3.5, Math.max(1, z));
      tableLightboxZoom = z;
      const table = scrollEl.querySelector('table.steps-dgm');
      if(table) table.style.zoom = z;
      e.preventDefault();
    }
  },{passive:false});
  scrollEl.addEventListener('touchend',e=>{
    if(e.touches.length<2) tableLightboxPinchStartDist=null;
  });
})();
function photoUrl(seed){ return `https://picsum.photos/seed/${encodeURIComponent(seed)}/400/400`; }
// Foto negra usada como sustituto cuando una receta no tiene fotografía.
const BLANK_PHOTO='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAIAAACQd1PeAAAADElEQVR42mNgYGAAAAAEAAHI6uv5AAAAAElFTkSuQmCC';
function photoTagHtml(photo, alt, cls){
  const safeAlt=(alt||'').replace(/"/g,'&quot;');
  return `<img class="${cls}" src="${photo||BLANK_PHOTO}" alt="${safeAlt}" loading="lazy">`;
}

/* Activa el botón de limpiar (x) de una .search-bar ya existente en el DOM. */
function enhanceSearchBar(wrapperEl, onChange){
  const input=wrapperEl.querySelector('input');
  const clearBtn=wrapperEl.querySelector('.clear-btn');
  if(!input || !clearBtn) return;
  function sync(){ wrapperEl.classList.toggle('has-value', !!input.value); }
  input.addEventListener('input',sync);
  clearBtn.addEventListener('click',()=>{
    input.value='';
    sync();
    input.focus();
    if(onChange) onChange('');
    else input.dispatchEvent(new Event('input'));
  });
  sync();
}
/* Crea una .search-bar completa (icono + input + botón limpiar) para usar en sheets dinámicos. */
function createSearchBarEl(placeholder, onInput){
  const wrap=document.createElement('div');
  wrap.className='search-bar';
  wrap.innerHTML=`
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" placeholder="${placeholder}" autocomplete="off">

  `;
  const input=wrap.querySelector('input');
  input.addEventListener('input',()=>onInput(input.value));
  enhanceSearchBar(wrap, val=>onInput(val));
  return {wrapper:wrap, input};
}

/* =========================================================
   REORDENAR ARRASTRANDO (arrastre por asa dedicada .drag-handle,
   sin activar la selección de texto de iOS al mantener pulsado)
========================================================= */
// container: el elemento cuyos hijos directos son los "sortable-item".
// onMove(fromIndex, toIndex): se llama al soltar, si el índice cambió.
function enableDragReorder(container, onMove){
  // Este contenedor persiste entre renders (add/quitar paso, editar categoría, etc.),
  // así que si ya tiene el listener de arrastre montado, NO lo volvemos a añadir
  // (eso apilaba varios manejadores obsoletos y provocaba reordenamientos erráticos).
  // Sólo actualizamos qué función "onMove" debe ejecutarse al soltar.
  container._sortableOnMove = onMove;
  if(container._sortableInitialized) return;
  container._sortableInitialized = true;

  let dragEl=null, pointerId=null, startClientY=0;
  let originalRects=[], items=[], draggedIndex=-1, currentIndex=-1;

  // --- Autoscroll: si al arrastrar el dedo llega arriba/abajo del todo del
  // contenedor con scroll (p.ej. el formulario de la receta), la pantalla
  // se desplaza sola en esa dirección, para poder mover el último paso al
  // principio (o viceversa) sin tener que soltar y scrollear a mano.
  const EDGE_ZONE=70;      // px cerca del borde donde empieza el autoscroll
  const MAX_SCROLL_SPEED=16; // px por frame como máximo
  let scrollContainer=null, scrollStartTop=0, lastClientY=0;
  let firstItemTop0=0, lastItemBottom0=0;
  let autoScrollDir=0, autoScrollSpeed=0, autoScrollRAF=null;

  function findScrollParent(el){
    let node=el.parentElement;
    while(node && node!==document.body){
      const style=getComputedStyle(node);
      if((style.overflowY==='auto'||style.overflowY==='scroll') && node.scrollHeight>node.clientHeight+1){
        return node;
      }
      node=node.parentElement;
    }
    return document.scrollingElement||document.documentElement;
  }

  function getItems(){ return Array.from(container.children).filter(el=>el.classList.contains('sortable-item')); }

  function onPointerDown(e){
    const handle=e.target.closest('.drag-handle');
    if(!handle || !container.contains(handle)) return;
    const item=handle.closest('.sortable-item');
    if(!item || item.parentElement!==container) return;
    e.preventDefault();
    items=getItems();
    draggedIndex=items.indexOf(item);
    if(draggedIndex===-1) return;
    currentIndex=draggedIndex;
    originalRects=items.map(el=>el.getBoundingClientRect());
    dragEl=item;
    pointerId=e.pointerId;
    startClientY=e.clientY;
    lastClientY=e.clientY;
    scrollContainer=findScrollParent(container);
    scrollStartTop=scrollContainer?scrollContainer.scrollTop:0;
    // Guardamos el borde superior del primer paso y el borde inferior del
    // último (en coordenadas de pantalla, en el momento de empezar a
    // arrastrar). En cada frame comprobamos si ese borde ya está dentro de
    // la zona visible del contenedor; si lo está, no hace falta seguir
    // haciendo autoscroll en esa dirección — así nunca se puede scrollear
    // más allá del principio o el final de la lista de pasos.
    firstItemTop0=originalRects[0]?originalRects[0].top:0;
    lastItemBottom0=originalRects[items.length-1]?originalRects[items.length-1].bottom:0;
    autoScrollDir=0; autoScrollSpeed=0;
    try{ dragEl.setPointerCapture(pointerId); }catch(err){}
    dragEl.classList.add('sortable-dragging');
    document.body.classList.add('sortable-active');
    document.addEventListener('pointermove', onPointerMove, {passive:false});
    document.addEventListener('pointerup', onPointerUp);
    document.addEventListener('pointercancel', onPointerUp);
    // Red de seguridad: 'lostpointercapture' se dispara SIEMPRE que se libera
    // la captura del puntero (al soltar, al cancelarse el gesto, o incluso si
    // el elemento se elimina del DOM mientras se arrastra), a diferencia de
    // 'pointerup'/'pointercancel', que en algunos móviles pueden no llegar a
    // dispararse en el documento si el gesto se interrumpe de forma anómala
    // (p.ej. el teclado se abre/cierra, o la lista cambia de tamaño a mitad
    // del arrastre). Sin esto, los listeners globales de pointermove/pointerup
    // podían quedar colgados para siempre, bloqueando todos los clics
    // posteriores de la app aunque el scroll y la escritura siguieran
    // funcionando con normalidad.
    dragEl.addEventListener('lostpointercapture', onPointerUp, {once:true});
  }

  // Recalcula posiciones y aplica los desplazamientos visuales para una
  // posición de dedo dada (clientY). Se usa tanto al mover el dedo como,
  // sin que el dedo se mueva, en cada frame del autoscroll (porque el
  // contenido se desplaza bajo el dedo aunque este no cambie de sitio).
  function updateDragPositions(clientY){
    if(!dragEl) return;
    // Cuánto ha scrolleado el contenedor desde que empezó el arrastre.
    // El elemento arrastrado y sus hermanos forman parte del flujo normal
    // dentro del contenedor con scroll, así que su posición "de reposo" en
    // la ventana ya se desplaza sola al hacer scroll (gratis, sin JS).
    // Para el elemento arrastrado eso NO es lo que queremos: tiene que
    // seguir pegado al dedo, así que a su transform le sumamos ese
    // desplazamiento para anular el movimiento automático y añadir encima
    // el seguimiento del dedo. Para los demás elementos (que si deben
    // moverse con el scroll con normalidad) restamos ese mismo delta a su
    // posición original para saber dónde están AHORA y poder compararlos.
    const scrollDelta=scrollContainer?(scrollContainer.scrollTop-scrollStartTop):0;
    const dy=clientY-startClientY;
    dragEl.style.transform=`translateY(${dy+scrollDelta}px)`;

    const draggedRect=originalRects[draggedIndex];
    const draggedCenter=draggedRect.top+draggedRect.height/2+dy;

    let newIndex=0;
    for(let i=0;i<items.length;i++){
      if(i===draggedIndex) continue;
      const rect=originalRects[i];
      const center=rect.top-scrollDelta+rect.height/2;
      if(draggedCenter>center) newIndex++;
    }

    if(newIndex!==currentIndex){
      const draggedHeight=draggedRect.height;
      items.forEach((el,i)=>{
        if(i===draggedIndex) return;
        el.classList.add('sortable-shift');
        let shift=0;
        if(newIndex>draggedIndex && i>draggedIndex && i<=newIndex) shift=-draggedHeight;
        else if(newIndex<draggedIndex && i<draggedIndex && i>=newIndex) shift=draggedHeight;
        el.style.transform = shift ? `translateY(${shift}px)` : '';
      });
      currentIndex=newIndex;
    }
  }

  function updateAutoScroll(clientY){
    if(!scrollContainer){ autoScrollDir=0; return; }
    const rect=scrollContainer.getBoundingClientRect();
    const scrollDelta=scrollContainer.scrollTop-scrollStartTop;
    const firstTopNow=firstItemTop0-scrollDelta;     // posición actual del borde superior del primer paso
    const lastBottomNow=lastItemBottom0-scrollDelta; // posición actual del borde inferior del último paso
    const distTop=clientY-rect.top;
    const distBottom=rect.bottom-clientY;
    if(distTop<EDGE_ZONE && firstTopNow<rect.top-0.5){
      autoScrollDir=-1;
      autoScrollSpeed=Math.ceil(MAX_SCROLL_SPEED*(1-Math.max(distTop,0)/EDGE_ZONE));
    } else if(distBottom<EDGE_ZONE && lastBottomNow>rect.bottom+0.5){
      autoScrollDir=1;
      autoScrollSpeed=Math.ceil(MAX_SCROLL_SPEED*(1-Math.max(distBottom,0)/EDGE_ZONE));
    } else {
      autoScrollDir=0;
    }
    if(autoScrollDir!==0 && autoScrollRAF===null){
      autoScrollRAF=requestAnimationFrame(autoScrollTick);
    }
  }

  function autoScrollTick(){
    autoScrollRAF=null;
    if(!dragEl || autoScrollDir===0) return;
    const maxNative=scrollContainer.scrollHeight-scrollContainer.clientHeight;
    const nextTop=scrollContainer.scrollTop+autoScrollDir*autoScrollSpeed;
    scrollContainer.scrollTop=Math.max(0,Math.min(maxNative,nextTop));
    updateDragPositions(lastClientY);
    // Recalculamos si hace falta seguir; si ya se ve el principio/final de
    // la lista de pasos, updateAutoScroll pondrá autoScrollDir a 0 y no
    // se pedirá ningún frame más (nada de scroll "infinito").
    updateAutoScroll(lastClientY);
  }

  function onPointerMove(e){
    if(!dragEl) return;
    e.preventDefault();
    lastClientY=e.clientY;
    updateAutoScroll(e.clientY);
    updateDragPositions(e.clientY);
  }

  function onPointerUp(){
    if(!dragEl) return;
    document.removeEventListener('pointermove', onPointerMove);
    document.removeEventListener('pointerup', onPointerUp);
    document.removeEventListener('pointercancel', onPointerUp);
    dragEl.removeEventListener('lostpointercapture', onPointerUp);
    if(autoScrollRAF!==null){ cancelAnimationFrame(autoScrollRAF); autoScrollRAF=null; }
    autoScrollDir=0; autoScrollSpeed=0; scrollContainer=null; firstItemTop0=0; lastItemBottom0=0;
    dragEl.classList.remove('sortable-dragging');
    dragEl.style.transform='';
    items.forEach(el=>{ el.classList.remove('sortable-shift'); el.style.transform=''; });
    document.body.classList.remove('sortable-active');
    const from=draggedIndex, to=currentIndex;
    dragEl=null; pointerId=null; draggedIndex=-1; currentIndex=-1; items=[]; originalRects=[];
    // Usamos siempre el callback más reciente guardado en el contenedor,
    // por si "render..." volvió a llamar a enableDragReorder entretanto.
    if(from!==-1 && to!==-1 && from!==to){
      const cb=container._sortableOnMove;
      if(cb) cb(from,to);
    }
  }

  // Salvaguarda adicional: si la app pierde el foco (cambio de app, el
  // usuario minimiza el navegador, etc.) a mitad de un arrastre, forzamos la
  // limpieza igualmente para no dejar nunca el estado "colgado".
  window.addEventListener('blur', ()=>onPointerUp());
  document.addEventListener('visibilitychange', ()=>{ if(document.hidden) onPointerUp(); });

  container.addEventListener('pointerdown', onPointerDown);
}

/* =========================================================
   POPUP DE CONFIRMACIÓN (p.ej. eliminar receta / categoría)
========================================================= */
function openConfirmDialog({title, message, confirmLabel='Eliminar', cancelLabel='Cancelar', onConfirm}){
  $('#confirm-title').textContent=title;
  $('#confirm-message').textContent=message;
  const backdrop=$('#confirm-backdrop');
  const okBtn=$('#confirm-ok-btn');
  const cancelBtn=$('#confirm-cancel-btn');
  okBtn.textContent=confirmLabel;
  cancelBtn.textContent=cancelLabel;

  function close(){
    backdrop.classList.remove('open');
    okBtn.removeEventListener('click', onOk);
    cancelBtn.removeEventListener('click', onCancel);
    backdrop.removeEventListener('click', onBackdropClick);
  }
  function onOk(){ close(); onConfirm(); }
  function onCancel(){ close(); }
  function onBackdropClick(e){ if(e.target===backdrop) onCancel(); }

  okBtn.addEventListener('click', onOk);
  cancelBtn.addEventListener('click', onCancel);
  backdrop.addEventListener('click', onBackdropClick);
  backdrop.classList.add('open');
}

    showCategories: true        // muestra/oculta las categorías bajo cada receta
  }

function findOrCreateIngredient(name, isSpice=false){
  const n = name.trim();
  if(!n) return null;
  let ing = state.ingredients.find(i=>normalize(i.name)===normalize(n));
  if(!ing){ ing = {id:uid('ing'), name:n, isSpice:!!isSpice}; state.ingredients.push(ing); }
  else if(isSpice && !ing.isSpice){ ing.isSpice=true; }
  return ing;
}
function findOrCreateSpiceIngredient(name){ return findOrCreateIngredient(name, true); }

function findOrCreateCategory(name){
  const n = name.trim();
  if(!n) return null;
  let cat = state.categories.find(c=>normalize(c.name)===normalize(n));
  if(!cat){ cat = {id:uid('cat'), name:n}; state.categories.push(cat); }
  return cat;
}
function ingredientUsageCount(ingredientId){
  let count=0;
  state.recipes.forEach(r=>{
    if(r.ingredients.some(i=>i.ingredientId===ingredientId)) count++;
    else if(r.spices.some(s=>s.ingredientId===ingredientId)) count++;
  });
  return count;
}

let activeCategory=null; // id de categoría o null

function categoryName(id){ const c=state.categories.find(x=>x.id===id); return c?c.name:''; }
function recipeCategoryNames(r){ return r.categoryIds.map(categoryName).filter(Boolean); }

function usedCategoryIds(){
  const set=new Set();
  state.recipes.forEach(r=>r.categoryIds.forEach(id=>set.add(id)));
  return state.categories.filter(c=>set.has(c.id));
}

function recipeMatches(r,q){
  if(!q) return true;
  const nq=normalize(q);
  if(normalize(r.name).includes(nq)) return true;
  if(r.ingredients.some(i=>normalize(i.name).includes(nq))) return true;
  if(r.spices.some(s=>normalize(s.name).includes(nq))) return true;
  if(recipeCategoryNames(r).some(c=>normalize(c).includes(nq))) return true;
  return false;
}

function scaledIngredients(r,servings){
  const factor = servings / r.servings;
  return r.ingredients.map(i=>({...i, scaledQty: i.qty*factor}));
}

// Agrupa los ingredientes y especias de una receta según el estado ACTUAL
// del alimento maestro (state.ingredients), no según en qué lista se guardó
// originalmente. Así, si marcas/desmarcas un alimento como especia, las
// recetas que lo usan lo muestran siempre en el apartado correcto.
function classifyRecipeItems(r){
  const combined = [
    ...r.ingredients.map(i=>({...i, _shape:'ingredient'})),
    ...r.spices.map(s=>({...s, _shape:'spice'}))
  ];
  const ingredients=[], spices=[];
  combined.forEach(item=>{
    const master = item.ingredientId ? state.ingredients.find(x=>x.id===item.ingredientId) : null;
    const isSpice = master ? !!master.isSpice : (item._shape==='spice');
    (isSpice ? spices : ingredients).push(item);
  });
  return {ingredients, spices};
}
// Convierte texto libre de cantidad ("1/2", "1 1/2", "200") a número.
// Devuelve '' si no se puede interpretar.
function parseAmountNumber(str){
  if(str==null) return '';
  const s=String(str).trim();
  if(!s) return '';
  const mixed=s.match(/^(\d+)\s+(\d+)\/(\d+)$/);
  if(mixed){
    const whole=Number(mixed[1]), num=Number(mixed[2]), den=Number(mixed[3]);
    if(den) return whole + num/den;
  }
  const frac=s.match(/^(\d+)\/(\d+)$/);
  if(frac){
    const num=Number(frac[1]), den=Number(frac[2]);
    if(den) return num/den;
  }
  const n=Number(s.replace(',','.'));
  return isNaN(n) ? '' : n;
}

// Convierte un item de receta (ya clasificado como ingrediente por
// classifyRecipeItems) a la fila del formulario de INGREDIENTE,
// conservando la cantidad/unidad aunque se guardara originalmente como
// especia (item._shape==='spice'), para no perder el dato al cambiar el
// tipo del alimento maestro entre ingrediente y especia.
function itemToIngredientRow(item){
  if(item._shape==='ingredient'){
    return {name:item.name, qty:item.qty!=null?item.qty:'', unit:item.unit!=null?item.unit:''};
  }
  const qty=parseAmountNumber(item.amount);
  return {name:item.name, qty: qty!==''?qty:'', unit: item.amount?'cucharadas':''};
}

// Convierte un item de receta (ya clasificado como especia) a la fila del
// formulario de ESPECIA, conservando la cantidad/unidad aunque se guardara
// originalmente como ingrediente (item._shape==='ingredient').
function itemToSpiceRow(item){
  if(item._shape==='spice'){
    return {name:item.name, amount:item.amount!=null?item.amount:''};
  }
  const qtyPart=(item.qty!=null && item.qty!=='') ? String(item.qty) : '';
  const combined=[qtyPart, item.unit].filter(Boolean).join(' ');
  return {name:item.name, amount: combined};
}
function formatRecipeItemAmount(item, factor=1){
  if(item._shape==='ingredient'){
    if(item.qty===''||item.qty==null) return (item.unit||'').trim();
    const scaled=fmtQty((Number(item.qty)||0)*factor);
    return `${scaled} ${item.unit||''}`.trim();
  }
  const amt=parseAmountNumber(item.amount);
  if(amt==='') return '';
  return `${fmtQty(amt*factor)} cuch.`.trim();
}

function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- Tabla de pasos: construida A MANO por el usuario ----------
   Ya no hay ningún algoritmo automático que infiera la tabla a partir de
   los pasos secuenciales. El usuario escribe el texto de la tabla en el
   formulario de edición de la receta (campo r.stepsTableText), con un
   formato de líneas tipo lista:
     - Paso global (sin alimento al principio): ocupa toda la fila.
     - alimento [+ texto libre]: [col_1, col_2, ..., col_N]
   Los corchetes son POSICIONALES: todas las líneas de alimento deben tener
   el mismo número de posiciones (una por columna de la tabla). Una posición
   vacía significa que ese alimento NO pasa por esa columna (no se agrupa
   ahí); una posición con texto se agrupa con las filas contiguas que tengan
   el mismo texto en esa misma posición. */
function parseStepsTableText(text){
  const lines=(text||'').split('\n').map(l=>l.trim()).filter(l=>l.startsWith('-'));
  const entries=[];
  lines.forEach(line=>{
    const content=line.slice(1).trim();
    if(!content) return;
    const m=content.match(/^(.*):\s*\[([^\]]*)\]\s*$/);
    if(m){
      const label=m[1].trim();
      // OJO: no se filtran los vacíos, la posición de cada valor importa.
      const tokens=m[2].split(',').map(t=>t.trim());
      if(label){ entries.push({type:'ing', label, tokens}); return; }
    }
    entries.push({type:'global', text:content});
  });
  return entries;
}
// Construye la cuadrícula (grid) columna a columna a partir de las líneas
// de alimento: cada fila es un alimento, cada columna una posición dentro
// de los corchetes. Se rellenan con '' las filas más cortas que el máximo
// para que todas queden alineadas.
function buildManualStepsGrid(ingEntries){
  if(ingEntries.length===0) return null;
  const numCols=Math.max(...ingEntries.map(e=>e.tokens.length));
  const grid=ingEntries.map(e=>{
    const row=e.tokens.slice(0,numCols);
    while(row.length<numCols) row.push('');
    return row;
  });
  return {grid, numCols, labels:ingEntries.map(e=>e.label)};
}
function stepsTableEmptyHtml(){
  return `<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10"/></svg><h3>Sin datos suficientes</h3></div>`;
}
function buildManualStepsTableHtml(text){
  const entries=parseStepsTableText(text);
  if(entries.length===0) return stepsTableEmptyHtml();

  const ingEntries=entries.filter(e=>e.type==='ing');
  const g=buildManualStepsGrid(ingEntries);
  if(!g){
    // Sólo hay pasos globales, sin ningún alimento: se listan como filas
    // simples de una sola columna.
    const rows=entries.map(e=>`<tr><td class="st-global" colspan="1">${escapeHtml(e.text)}</td></tr>`).join('');
    return `<div class="steps-table-wrap"><table class="steps-dgm"><tbody>${rows}</tbody></table></div>`;
  }

  // Para cada columna, agrupa en tramos contiguos las filas que comparten
  // el mismo texto (no vacío): mark[fila][col] = N (nº de filas que ocupa,
  // inicio del grupo), -1 (fila cubierta por el rowspan de un grupo
  // anterior, no se pinta), o 0 (posición vacía, celda propia en blanco).
  const rows=g.grid.length;
  const mark=g.grid.map(()=>new Array(g.numCols).fill(0));
  for(let c=0;c<g.numCols;c++){
    let r=0;
    while(r<rows){
      const val=g.grid[r][c];
      if(!val){ r++; continue; }
      let span=1;
      while(r+span<rows && g.grid[r+span][c]===val) span++;
      mark[r][c]=span;
      for(let k=1;k<span;k++) mark[r+k][c]=-1;
      r+=span;
    }
  }

  const totalCols=1+g.numCols;
  let ingCounter=-1;
  const rowsHtml=entries.map(e=>{
    if(e.type==='global'){
      return `<tr><td class="st-global" colspan="${totalCols}">${escapeHtml(e.text)}</td></tr>`;
    }
    ingCounter++;
    const r=ingCounter;
    // Si el alimento no entra en una o varias columnas seguidas justo
    // después de su nombre (posiciones vacías al principio), esas celdas
    // se "fusionan" visualmente con la celda del nombre: se les quita el
    // borde que las separa para que parezca una única celda agrupada,
    // manteniendo el nombre alineado a la izquierda.
    let leadEmpty=0;
    while(leadEmpty<g.numCols && mark[r][leadEmpty]===0) leadEmpty++;
    let tds=`<td class="st-ing${leadEmpty>0?' st-ing-merged':''}"><span class="st-ing-name">${escapeHtml(g.labels[r])}</span></td>`;
    for(let c=0;c<g.numCols;c++){
      const m=mark[r][c];
      if(m===-1) continue; // cubierta por el rowspan de una fila anterior
      if(m===0){
        const merged = c<leadEmpty;
        const cont = merged && c<leadEmpty-1;
        tds+=`<td class="st-empty${merged?' st-empty-merged':''}${cont?' st-empty-merged-cont':''}"></td>`;
      }
      else { tds+=`<td class="st-op" rowspan="${m}"><span class="st-op-label">${escapeHtml(g.grid[r][c])}</span></td>`; }
    }
    return `<tr>${tds}</tr>`;
  }).join('');
  return `<div class="steps-table-wrap"><table class="steps-dgm"><tbody>${rowsHtml}</tbody></table></div>`;
}

  const ingRows=$('#ingredient-rows');
  if(ingRows) ingRows.innerHTML = grouped.ingredients.map(i=>`<div class="ingredient-row"><span>${i.name}</span><span class="qty">${formatRecipeItemAmount(i,factor)}</span></div>`).join('');
  const spiceRows=$('#spice-rows');
  if(spiceRows) spiceRows.innerHTML = grouped.spices.map(s=>`<div class="spice-row"><span>${s.name}</span><span class="amt">${formatRecipeItemAmount(s,factor)}</span></div>`).join('');
  renderStepsView(r);
}

// Selector de categorías para una receta concreta: sólo permite buscar y
// marcar/desmarcar categorías ya existentes. Crear, editar y eliminar
// categorías se hace ahora desde el panel "Alimentos → Categorías".
function openCategoryPickerSheet(){
  const f=formState;
  let query='';
  openSheet({
    title:'Categorías',
    bodyBuilder:(body)=>{
      const {wrapper:searchWrap, input:searchInput} = createSearchBarEl('', val=>{ query=val; renderList(); });
      searchWrap.style.marginBottom='10px';
      body.appendChild(searchWrap);
      const list=document.createElement('div');
      body.appendChild(list);

      function renderList(){
        list.innerHTML='';
        const nq=normalize(query);
        const matches=state.categories.filter(c=>normalize(c.name).includes(nq)).sort((a,b)=>a.name.localeCompare(b.name,'es'));
        const exact=state.categories.some(c=>normalize(c.name)===nq);

        if(query.trim() && !exact){
          const createRow=document.createElement('div');
          createRow.className='create-cat-row';
          createRow.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg><span>Crear categoría "${query.trim()}"</span>`;
          createRow.addEventListener('click',()=>{
            const cat=findOrCreateCategory(query.trim());
            if(!f.categoryIds.includes(cat.id)) f.categoryIds.push(cat.id);
            query=''; searchInput.value='';
            renderList();
          });
          list.appendChild(createRow);
        }

        if(state.categories.length===0 && !query.trim()){
          const empty=document.createElement('p');
          empty.className='subsection-hint';
          empty.textContent='Aún no hay categorías. Escribe un nombre arriba para crear la primera.';
          list.appendChild(empty);
          return;
        }
        matches.forEach(cat=>{
          const row=document.createElement('div');
          row.className='cat-sel-row';
          const checked=f.categoryIds.includes(cat.id);
          row.innerHTML=`
            <div class="sel-check" style="${checked?'background:var(--accent);border-color:var(--accent);':''}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="opacity:${checked?1:0}; color:var(--accent-ink);"><polyline points="20 6 9 17 4 12"/></svg></div>
            <span class="name">${cat.name}</span>`;
          row.addEventListener('click',()=>{
            if(f.categoryIds.includes(cat.id)) f.categoryIds=f.categoryIds.filter(x=>x!==cat.id);
            else f.categoryIds.push(cat.id);
            renderList();
          });
          list.appendChild(row);
        });
      }
      renderList();
    },
    footerLabel:'Aplicar',
    onConfirm:()=>{ renderForm(); }
  });
}

function showIngredientSuggestions(inputEl, boxEl, onPick, filterFn=null, allowCreate=false, createLabel='alimento'){
  const existing=boxEl.querySelector('.ac-suggestions'); if(existing) existing.remove();
  const q=normalize(inputEl.value);
  if(!q) return;
  let pool=state.ingredients;
  if(filterFn) pool=pool.filter(filterFn);
  const matches=pool.filter(i=>normalize(i.name).includes(q)).slice(0,6);
  const box=document.createElement('div');
  box.className='ac-suggestions';
  matches.forEach(m=>{
    const d=document.createElement('div');
    d.textContent=m.name;
    d.addEventListener('mousedown',ev=>{ ev.preventDefault(); onPick(m.name); box.remove(); });
    box.appendChild(d);
  });
  if(allowCreate){
    const exact=state.ingredients.some(i=>normalize(i.name)===q);
    if(!exact){
      const d=document.createElement('div');
      d.style.color='var(--accent)'; d.style.fontWeight='700';
      d.textContent=`Crear ${createLabel} "${inputEl.value.trim()}"`;
      d.addEventListener('mousedown',ev=>{ ev.preventDefault(); onPick(inputEl.value.trim()); box.remove(); });
      box.appendChild(d);
    }
  }
  if(box.children.length===0) return;
  boxEl.appendChild(box);
  inputEl.addEventListener('blur',()=>setTimeout(()=>box.remove(),150),{once:true});
}

$('#form-save-btn').addEventListener('click',()=>{
  const f=formState;
  if(!f.name.trim()){ showToast('Ponle un nombre a la receta'); return; }
  const cleanIngredients = f.ingredients
    .filter(i=>i.name && i.name.trim())
    .map(i=>{
      const master=findOrCreateIngredient(i.name);
      const num=(i.qty===''||i.qty==null) ? '' : Number(i.qty);
      return {ingredientId:master.id, name:master.name, qty:(num===''||isNaN(num))?'':num, unit:(i.unit||'').trim()};
    });
  const cleanSpices = f.spices
    .filter(s=>s.name && s.name.trim())
    .map(s=>{
      const master=findOrCreateSpiceIngredient(s.name);
      return {ingredientId:master.id, name:master.name, amount:(s.amount||'').trim()};
    });
  const cleanSteps = f.steps
    .map(s=>({type:s.type, text:s.text.trim()}))
    .filter(s=>s.text);
  const cleanStepsTableText = (f.stepsTableText||'').replace(/[ \t]+\n/g,'\n').trim();

  if(f.id){
    const r=state.recipes.find(x=>x.id===f.id);
    Object.assign(r,{
      name:f.name.trim(), photo:f.photo||'', prepMin:f.prepMin, cookMin:f.cookMin,
      servings:f.servings, categoryIds:f.categoryIds, ingredients:cleanIngredients, spices:cleanSpices, steps:cleanSteps,
      stepsTableText:cleanStepsTableText
    });
    showToast('Receta actualizada');
  } else {
    state.recipes.push({
      id:uid('rec'), name:f.name.trim(), photo:f.photo||'', prepMin:f.prepMin, cookMin:f.cookMin,
      servings:f.servings, categoryIds:f.categoryIds, ingredients:cleanIngredients, spices:cleanSpices, steps:cleanSteps,
      stepsTableText:cleanStepsTableText
    });
    showToast('Receta creada');
  }
  closeRecipeForm();
  renderCategoryChips(); renderRecipeList();
  scheduleSave();
});
